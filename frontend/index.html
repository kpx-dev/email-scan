  }
  html += '</div>';
  html += '<table class="mini"><thead><tr><th>Control</th><th>Where</th><th>What you see</th></tr></thead><tbody>';
  html += '<tr><td>' + esc(PUBLIC_THROTTLE.rate) + ' req/s rate, ' + esc(PUBLIC_THROTTLE.burst) +
    ' burst</td><td class="muted">API Gateway route-level throttle on this route only</td>' +
    '<td class="muted">HTTP 429 the moment you exceed it — expected, not an outage. Pace a load test at or ' +
    'below ' + esc(PUBLIC_THROTTLE.rate) + ' req/s.</td></tr>';
  html += '<tr><td>' + esc(cap.toLocaleString()) + ' requests/day</td>' +
    '<td class="muted">counted in DynamoDB and enforced in the Lambda</td>' +
    '<td class="muted">HTTP 429 with the reset time in the body. Enforced before the model call, so a leaked ' +
    'key cannot run an unbounded bill overnight.</td></tr>';
  html += '<tr><td>x-api-key required</td><td class="muted">checked in the Lambda</td>' +
    '<td class="muted">401 without it, or with the wrong value. The gateway route is authorization_type NONE ' +
    'by design, so the key is the only credential on this path. A 403 here means something else: the call did ' +
    'not come through CloudFront, so it carried no x-origin-secret.</td></tr>';
  html += '<tr><td>no systemPrompt on this route</td><td class="muted">ignored in the Lambda</td>' +
    '<td class="muted">Silently runs the default prompt body rather than erroring, because the request is ' +
    'otherwise valid. A key-holder able to supply system instructions would have a general-purpose LLM proxy ' +
    'on this account’s Bedrock quota. Use /classify or /deep-scan with an IdToken to send one.</td></tr>';
  html += '</tbody></table>';
  html += '<div class="muted small">These limits are on <span class="mono">/public/scan</span>. The two ' +
    'Cognito routes are bounded by the session instead — no daily counter, because a signed-in operator is ' +
    'not the threat model a leaked key is.</div>';
  html += '</section>';
  return html;
}

/* ----------------------------------------------------------------- the runs table */

function runsSummary(runs) {
  var bySource = {};
  var escalated = 0;
  var ttft = [];
  runs.forEach(function (r) {
    bySource[r.source] = (bySource[r.source] || 0) + 1;
    if (r.escalated) escalated++;
    if (r.timings.ttftMs !== null) ttft.push(r.timings.ttftMs);
  });

  /* pct() is this page's existing nearest-rank-with-ceil percentile — idx = ceil(p/100 * n) - 1,
     the same rule bench/driver.py uses — so this p50 is directly comparable to the Benchmark
     tab's numbers rather than being a second algorithm that disagrees at small n. */
  var p50 = pct(ttft, 50);

  var order = ['ui', 'api'];
  Object.keys(bySource).forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });

  var html = '<div class="stats">';
  html += '<span><strong>' + esc(runs.length.toLocaleString()) + '</strong> runs</span>';
  order.forEach(function (k) {
    if (!bySource[k]) return;
    html += '<span>' + sourceBadge(k) + ' <strong>' + esc(bySource[k].toLocaleString()) + '</strong></span>';
  });
  html += '<span>escalated <strong>' + esc(escalated.toLocaleString()) + '</strong>' +
    (runs.length ? ' <span class="muted">(' + esc(((escalated / runs.length) * 100).toFixed(0)) + '%)</span>' : '') +
    '</span>';
  html += '<span title="Nearest-rank with ceil across the ' + esc(ttft.length) +
    ' runs shown that recorded a TTFT — the same percentile rule as the benchmark harness.">' +
    'TTFT P50 <strong>' + fmt(p50) + '</strong>ms</span>';
  html += '</div>';
  if (runs.length && escalated / runs.length > 0.5) {
    html += '<div class="muted small" style="margin-bottom:8px">An escalation rate this high is a corpus ' +
      'artifact, not a finding: the demo samples are deliberately threat-heavy. The rate that matters can ' +
      'only come from real mail (design §9.3).</div>';
  }
  return html;
}

/** The expanded row: the full stored email, Stage 1's signals, and Stage 2's decision. */
function runDetail(r) {
  var html = '<div class="expand-inner">';

  /* --- the stored email, in full --- */
  html += '<div><h3>Stored email</h3>';
  html += kvGrid([
    ['from', r.email.from, 'mono break'],
    ['subject', r.email.subject, '']
  ]);
  if (r.email.attachments.length) {
    html += tagRow('Attachments', r.email.attachments);
  } else {
    html += '<div class="muted small" style="margin-top:6px">No attachment names on this run.</div>';
  }
  html += '<div class="k" style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:10px">Body</div>';
  html += '<pre class="stored">' + esc(r.email.body || '(empty)') + '</pre>';
  html += '<div class="muted small">' + esc(r.email.body.length.toLocaleString()) +
    ' characters, stored verbatim. Attachments are names only — nothing binary is parsed.</div>';
  html += '</div>';

  /* A Deep Scan row has no Stage 1 at all, so the Stage 1 block is skipped rather than rendered
     empty — an empty verdict chip and "no signals recorded" would read as a Stage 1 that ran and
     found nothing. `stages` is what distinguishes the two; rows written before that field existed
     fall through to the pipeline shape, which is what they were. */
  var ranS1 = r.stages.length === 0 || r.stages.indexOf('classify') !== -1;
  var ranS2 = r.stages.length ? r.stages.indexOf('deep-scan') !== -1 : !!r.stage2;

  /* --- Stage 1 --- */
  if (!ranS1) {
    html += '<div><h3>Stage 1 — classify</h3>' +
      '<div class="skipped"><strong>Not run on this scan.</strong> This row is a standalone Deep Scan ' +
      '(<span class="mono">POST ' + esc(API_BASE) + '/deep-scan</span>), so there is no triage pass and no ' +
      'gate decision to show. The confidence and signals columns belong to Stage 1 and are empty for the ' +
      'same reason — not because Stage 1 found nothing.</div></div>';
  } else {
  html += '<div><h3>Stage 1 — classify</h3>';
  html += '<div class="result-head">';
  html += '<span class="verdict ' + (VERDICT_CLASS[r.verdict] || '') + '">' + esc(r.verdict) + '</span>';
  if (r.confidence !== null) {
    html += '<span class="chip">confidence ' + esc((r.confidence * 100).toFixed(0)) + '%</span>';
  }
  html += '<span class="chip">' + esc(shortModel(r)) + '</span>';
  html += '</div>';
  if (r.parseError) {
    html += '<div class="warn"><strong>Model did not return valid JSON.</strong> ' + esc(r.parseError) +
      '<div class="muted">The gate escalates on <span class="mono">parse_failed</span> rather than trusting ' +
      'an unparseable verdict.</div></div>';
  }
  if (r.signals.length) {
    html += '<table class="mini"><thead><tr><th>#</th><th>Signal</th><th>Detail</th></tr></thead><tbody>';
    r.signals.forEach(function (s, i) {
      var sig = typeof s === 'string' ? s : ((s && s.signal) || '');
      var det = typeof s === 'string' ? '' : ((s && s.detail) || '');
      html += '<tr class="sigrow"><td class="num">' + (i + 1) + '</td><td>' + esc(sig) + '</td>' +
        '<td>' + esc(det) + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="muted small">Ranked strongest-evidence-first by the model, at most five.</div>';
  } else {
    html += '<div class="muted small">No signals recorded on this run.</div>';
  }
  html += '</div>';
  }

  /* --- Stage 2 + the gate --- */
  html += '<div><h3>Stage 2 — deep scan</h3>';
  if (r.escalated) {
    html += '<div class="arrow"><strong>escalated ↓</strong> <code>' +
      esc(r.escalationReason || '(no reason recorded)') + '</code>' +
      '<div class="why">' + esc(escalationGloss(r.escalationReason)) + '</div></div>';
  } else if (r.source === 'ui-deep') {
    html += '<div class="arrow"><strong>run on request</strong> — not escalated into' +
      '<div class="why">The Deep Scan button calls this stage directly, so the gate was never consulted. ' +
      '<span class="mono">escalated</span> is false here because nothing escalated, not because the gate ' +
      'declined.</div></div>';
  } else if (r.source === 'ui-simple') {
    html += '<div class="arrow' + (r.escalationReason ? '' : ' quiet') + '"><strong>' +
      (r.escalationReason ? 'the gate would have escalated' : 'the gate would have stopped here') +
      '</strong>' + (r.escalationReason ? ' <code>' + esc(r.escalationReason) + '</code>' : '') +
      '<div class="why">A Simple Scan records the gate’s decision without acting on it — no Stage 2 ran. ' +
      (r.escalationReason ? esc(escalationGloss(r.escalationReason)) : 'Benign, confident, and no URL or ' +
      'attachment.') + '</div></div>';
  } else {
    html += '<div class="arrow quiet"><strong>no escalation</strong> — Stage 2 skipped' +
      '<div class="why">Benign, confident, and no URL or attachment. This is the ~85% of traffic that stops ' +
      'after the cheap stage, which is what makes the pipeline a cost strategy as well as a latency one.</div></div>';
  }
  if (ranS2 && r.stage2) {
    html += '<div class="result-head">';
    if (r.stage2.recommendedAction) {
      html += '<span class="chip action">' + esc(String(r.stage2.recommendedAction).toUpperCase()) + '</span>';
    }
    if (r.stage2.riskScore !== null) {
      html += '<span class="chip risk">risk ' + esc(r.stage2.riskScore) + '/100</span>';
    }
    html += '<span class="chip"' +
      (r.stage2.disagreesWithStage1
        ? ' title="Stage 2 overturned Stage 1 — this is the pipeline earning its second call"'
        : '') + '>' +
      (r.stage2.disagreesWithStage1 ? 'disagrees with Stage 1' : 'agrees with Stage 1') + '</span>';
    html += '</div>';
    html += kvGrid([
      ['recommendedAction', r.stage2.recommendedAction, 'mono'],
      ['riskScore', r.stage2.riskScore === null ? '' : r.stage2.riskScore + ' / 100', 'mono'],
      ['disagreesWithStage1', r.stage2.disagreesWithStage1 ? 'true' : 'false', 'mono']
    ]);
  } else {
    html += '<div class="muted small">No Stage 2 result stored on this run.</div>';
  }

  /* --- the run itself --- */
  html += '<h3>Run</h3>';
  html += kvGrid([
    ['runId', r.runId, 'mono'],
    ['when', utcStamp(r.ts), 'mono'],
    ['source', r.source, 'mono'],
    ['stages run', stagesCell(r) + (r.stages.length ? '' : ' (not recorded on this row; inferred)'), 'mono'],
    ['system prompt', r.promptOverridden
      ? 'edited — this run used a prompt body from the Scan tab’s editor, not prompts.py'
      : 'default (prompts.py)', ''],
    ['model', r.modelLabel || r.modelId, ''],
    ['modelId', r.modelId, 'mono'],
    ['lane', (r.endpoint || '—') + ' · ' + (r.region || '—'), 'mono'],
    ['served via', r.servedVia || 'not recorded on this row', 'mono'],
    ['TTFT', r.timings.ttftMs === null ? 'n/a' : fmt(r.timings.ttftMs) + ' ms', 'mono'],
    ['E2E', r.timings.e2eMs === null ? 'n/a' : fmt(r.timings.e2eMs) + ' ms', 'mono'],
    ['Bedrock latency', r.timings.bedrockLatencyMs === null ? 'n/a on this lane' : fmt(r.timings.bedrockLatencyMs) + ' ms', 'mono'],
    ['Overhead', r.timings.overheadMs === null ? 'n/a on this lane' : fmt(r.timings.overheadMs) + ' ms', 'mono'],
    ['Output rate', r.timings.otps === null ? 'n/a' : (Math.round(r.timings.otps * 10) / 10) + ' tok/s', 'mono'],
    ['Tokens', r.usage.inputTokens.toLocaleString() + ' in · ' + r.usage.outputTokens.toLocaleString() +
      ' out · ' + r.usage.totalTokens.toLocaleString() + ' total', 'mono']
  ]);
  if (r.timings.bedrockLatencyMs === null) {
    html += '<div class="muted small">Bedrock latency and overhead are genuinely absent on the mantle lane: the ' +
      'OpenAI-shape response carries no equivalent of Converse’s metadata.metrics.latencyMs, and there is no ' +
      '<span class="mono">x-amzn-*</span> header to substitute. A 0 there would read as infinitely fast.</div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

/** "S1", "S2" or "S1→S2" — which stages this row actually ran. Falls back to inferring from the
 *  stage2 block for rows written before `stages` existed, and says "—" rather than guessing when
 *  there is nothing to go on. */
function stagesCell(r) {
  var label = { classify: 'S1', 'deep-scan': 'S2' };
  if (r.stages.length) {
    return r.stages.map(function (s) { return label[s] || s; }).join('→');
  }
  return r.stage2 ? 'S1→S2' : 'S1';
}

function runsTable(runs) {
  var html = '<table class="mini runs"><thead><tr>' +
    '<th class="caret"></th>' +
    '<th>When</th><th>Source</th><th>Stages</th><th>Verdict</th><th>Model</th><th>Escalated</th>' +
    '<th class="num">TTFT ms</th><th class="num">E2E ms</th><th class="num">Tokens in/out</th>' +
    '</tr></thead><tbody>';

  runs.forEach(function (r) {
    var open = !!state.runsOpen[r.key];
    /* tabindex + aria-expanded so the expander is reachable and legible without a mouse.
       The row stays a <tr> — no role override — so the table semantics survive. */
    html += '<tr class="rowhead' + (open ? ' hi' : '') + '" data-run="' + esc(r.key) + '"' +
      ' tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '">';
    html += '<td class="caret">' + (open ? '▾' : '▸') + '</td>';

        ? ' <span class="cold" title="This scan ran on an edited system prompt from the Scan tab’s editor, ' +
          'so its verdict and latency describe that prompt and are not comparable to the other rows. The ' +
          'injection guard was still appended server-side.">edited prompt</span>'

    html += '<td class="mono" title="' + esc(SOURCE_HINT[r.source] || '') + '">' + esc(stagesCell(r)) + '</td>';
    html += '<td><span class="verdict-sm ' + (VERDICT_CLASS[r.verdict] || '') + '">' + esc(r.verdict) + '</span>' +
      (r.parseError ? ' <span class="cold" title="' + esc('parse error: ' + r.parseError) + '">⚠</span>' : '') +
      '</td>';
    html += '<td class="truncate" title="' + esc((r.modelLabel || r.modelId || '—') + ' · ' +
      (r.endpoint || '—') + ' · ' + (r.region || '—')) + '">' +
      esc(shortModel(r)) + ' <span class="muted">' + esc(r.region || '—') + '</span></td>';
    html += '<td' + (r.escalated ? '' : ' class="muted"') + ' title="' +
      esc(r.escalated
        ? 'gate reason: ' + (r.escalationReason || '(none recorded)')
        : 'The gate returned no reason, so Stage 2 was skipped.') + '">' +
      (r.escalated ? 'yes' : 'no') + '</td>';
    html += '<td class="num">' + latCell(r.timings.ttftMs) + '</td>';
    html += '<td class="num">' + latCell(r.timings.e2eMs) + '</td>';
    html += '<td class="num">' + esc(r.usage.inputTokens.toLocaleString()) + ' / ' +
      esc(r.usage.outputTokens.toLocaleString()) + '</td>';
    html += '</tr>';
    if (open) {
      html += '<tr class="expand"><td class="caret"></td><td colspan="9">' + runDetail(r) + '</td></tr>';
    }
  });

  return html + '</tbody></table>';
}

function resultsTab() {
  var runs = state.runsAll;

  /* --- the session strip, moved here off the Scan tab. Two different things both called "runs",
         so they are two panels with the difference stated rather than one merged table:
         this one is in-memory and this browser tab's own, the one below is server-persisted. --- */
  var html = '<section class="panel"><h2>This session</h2>';
  html += '<div class="muted small" style="margin:0 0 8px">Every scan run from this browser tab, ' +
    'held in memory and lost on reload. Latency from a single request is noise, so the percentiles ' +
    'here are what a handful of scans is actually worth — they use nearest-rank with ceil, the same ' +
    'rule as <span class="mono">bench/driver.py</span>, so they are directly comparable to the ' +
    'Benchmark tab rather than being a second algorithm that disagrees at small n.</div>';
  html += runHistory();
  html += '</section>';

  html += '<section class="panel" style="margin-top:16px">';
  html += '<div class="row wrap" style="align-items:center"><h2 style="margin:0;flex:1">Scan results' +
    (runs.length ? ' <span class="muted">(' + esc(runs.length.toLocaleString()) + ')</span>' : '') + '</h2>' +
    '<button id="runs-refresh"' + (state.runsBusy ? ' disabled' : '') + '>' +
    (state.runsBusy ? 'Loading…' : 'Refresh') + '</button></div>';
  html += '<div class="muted small" style="margin:6px 0 10px">Every scan the backend has persisted, most ' +
    'recent first — Simple Scans and Deep Scans run from this page, and every call made against the public ' +
    'API, in one table with a badge saying which. <span class="mono">GET ' + esc(API_BASE) + '/runs</span>, ' +
    'behind the Cognito JWT authorizer, so this view is admin-only. Items expire on a 7-day TTL.</div>';

  if (state.runsError) {
    html += '<div class="danger"><strong>Could not load scan results.</strong> ' + esc(state.runsError) +
      '<div class="muted">A CloudFront-returned HTML shell shows up here as a text excerpt rather than as an ' +
      'unexplained “Unexpected token &lt;”.</div></div>';
  }

  if (runs.length) {
    html += runsSummary(runs);
    html += runsTable(runs);
    html += '<div class="muted small">Click any row to expand it: the full stored email, Stage 1’s ranked ' +
      'signals, and Stage 2’s recommended action. <span class="mono">n/a</span> means the value genuinely does ' +
      'not exist on that lane, never that it was zero. A row badged <span class="mono">edited prompt</span> ' +
      'ran on a system prompt from the Scan tab’s editor, so its latency and verdict are not comparable to ' +
      'the rest of the table.</div>';
  } else if (state.runsBusy) {
    html += '<p class="muted">Loading…</p>';
  } else if (!state.runsTried) {
    html += '<p class="muted">Press Refresh to load the persisted scan results.</p>';
  } else if (!state.runsError) {
    html += '<div class="ok"><strong>No scans recorded yet.</strong> Press Simple Scan or Deep Scan on the ' +
      'Scan tab, or run one of the snippets on the API Integration tab — either lands here, with the badge ' +
      'showing which one it was.</div>';
  }

  html += '</section>';
  return html;
}

/* GET /api/runs through the same call() helper as everything else, so it inherits the Bearer
   token and the non-JSON error branch. */
async function loadRuns() {
  state.runsBusy = true;
  state.runsError = null;
  state.runsTried = true;
  render();
  try {
    var body = await call('/runs');
    var incoming = Array.isArray(body.runs) ? body.runs : [];
    /* The backend Querys pk="RUN" descending on an ISO-prefixed sort key, so it already
       arrives newest-first. Sorting again is two lines and makes the column honest even if a
       future paginated read interleaves pages. */
    state.runsAll = incoming.map(normRun).sort(function (a, b) {
      return (b.tsMs === null ? -Infinity : b.tsMs) - (a.tsMs === null ? -Infinity : a.tsMs);
    });
    state.runsMeta = {
      count: num(body.count),
      publicEndpoint: body.publicEndpoint || null,
      apiKey: body.apiKey || null,
      dailyUsage: body.dailyUsage || null
    };
  } catch (e) {
    if (e.authFailed) {
      clearSession();
      state.loginError = 'Session expired or rejected by the API Gateway JWT authorizer. Sign in again.';
      state.runsBusy = false;
      render();
      return;
    }
    state.runsError = String(e.message || e);
  } finally {
    state.runsBusy = false;
  }
  render();
}

/** Clipboard, with the execCommand fallback for the case where the Clipboard API is refused.
 *  The payload comes from COPY_PAYLOADS, never from the rendered DOM. */
function copyText(what) {
  var text = COPY_PAYLOADS[what] || '';

  function done(ok) {
    state.runsCopied = ok ? what : null;
    state.runsCopyError = ok ? null
      : 'The browser refused the clipboard write. Select the text above and copy it manually.';
    if (state.tab === 'results' || state.tab === 'api') render();
    if (!ok) return;
    setTimeout(function () {
      if (state.runsCopied !== what) return;
      state.runsCopied = null;
      if (state.tab === 'results' || state.tab === 'api') render();
    }, 1600);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    return;
  }
  done(legacyCopy(text));
}

function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) {
    return false;
  }
}

/* ================================================================== shell + render === */

/* The login box is deliberately bare: title, two fields, the button, and the two banners
   that are load-bearing when something is wrong. The theme toggle sits outside the card so
   the mode can be changed before there is any session. */
function loginView() {

  html += '<section class="panel login-card">';
  html += '<h1>Email Scan — Bedrock PoC</h1>';
  if (state.loginError) html += '<div class="danger"><strong>Sign-in failed.</strong> ' + esc(state.loginError) + '</div>';
  if (!COGNITO_CLIENT_ID) {
    html += '<div class="warn"><strong>No Cognito client id in this page.</strong> deploy.sh injects ' +
      '<code>window.COGNITO_CLIENT_ID</code> and <code>window.COGNITO_POOL_ID</code> at upload time. ' +
      'You are looking at the un-injected source file.</div>';
  }

  html += '<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" value="">';
  html += '<div class="actions"><button class="primary" id="signin"' + (state.loginBusy ? ' disabled' : '') + '>' +
    (state.loginBusy ? 'Signing in…' : 'Sign in') + '</button></div>';

}

var TABS = [
  ['scan', 'SCAN'],
  ['results', 'SCAN RESULTS'],
  ['bench', 'BENCHMARK'],
  ['api', 'API INTEGRATION']
];

function shellView() {
  var html = '<div class="app">';
  html += '<div class="topbar"><header style="margin:0">';
  html += '<h1>Email Scan — Bedrock PoC</h1>';
  html += '<div class="sub">Two-stage pipeline · <strong>Amazon Bedrock</strong> · ' + esc(state.region) +
    (state.region === DEFAULT_REGION ? ' (EU default)' : '') +
    ' · targets: TTFT &lt;' + TARGETS.ttftMs +
    'ms · Simple P50 &lt;' + TARGETS.classifyP50Ms + 'ms · Deep P95 &lt;' + TARGETS.deepScanP95Ms + 'ms</div>';
  html += '</header><div class="who"><span>signed in as <strong>' + esc(state.user || 'demo') + '</strong></span>' +
    '<button class="link" id="signout">sign out</button>' + themeToggleHtml() + '</div></div>';

  html += '<div class="tabs main">';
  TABS.forEach(function (t) {
    html += '<button class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>';
  });
  html += '</div>';

  if (state.tab === 'scan') html += scanTab();
  else if (state.tab === 'results') html += resultsTab();
  else if (state.tab === 'bench') html += benchTab();
  else html += apiTab();

}

function render() {
  var app = document.getElementById('app');
  app.innerHTML = state.token ? shellView() : loginView();
  wire();
}

/** Bind one handler to one element, handing the handler its OWN reference to that element.
 *
 *  This exists because of a real bug, and the shape of it is worth keeping written down. wire()
 *  used to hold a single `var el` and reassign it down the function:
 *
 *      el = document.getElementById('sample');
 *      if (el) el.onchange = function () { var i = Number(el.value); ... };   // <-- wrong
 *      el = document.getElementById('model');
 *      ...
 *      el = document.getElementById('clear-scan');    // el now points HERE
 *
 *  `var` is function-scoped and a closure captures the VARIABLE, not its value, so every one of
 *  those callbacks read whichever element was assigned last in that wire() call. Picking a sample
 *  ran `Number(clearScanButton.value)`, which is `Number('')` — 0 — so the corpus selector
 *  silently snapped back to sample 1 on every change and looked like it did nothing. The model
 *  and region selectors set state to `''`, and the flex checkbox never registered.
 *
 *  One binder, one closure per element, and the class of bug is gone rather than patched.
 */
function on(id, event, fn) {
  var node = document.getElementById(id);
  if (!node) return null;
  node[event] = function (ev) { return fn(node, ev); };
  return node;
}

/* Event wiring. Text inputs mutate state without re-rendering, so typing never loses the
   caret; everything structural re-renders. */
function wire() {

  /* Wired before the login early-return, so the toggle works on both views. The handler
     reads state, writes localStorage and stamps <html> itself — it never reads the DOM and
     it does not need render() to have run. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) {
    b.onclick = toggleTheme;
  });

  if (!state.token) {
    var doSignIn = async function () {
      // Read the fields BEFORE render(). render() rebuilds this section with innerHTML, which
      // destroys the inputs and recreates them from the markup -- where password is value="".
      // Reading after it sent Cognito an empty PASSWORD, and Cognito reports an empty required
      // string as "Missing required parameter PASSWORD", which reads like a client bug in the
      // request shape rather than a wiped field. Username hid the problem: its markup hardcodes
      // value="demo", so only the password came back blank.
      var username = document.getElementById('u').value.trim();
      var password = document.getElementById('p').value;
      if (!password) {
        state.loginError = 'Enter the demo password before signing in.';
        render();
        return;
      }

      state.loginBusy = true;
      state.loginError = null;
      render();
      try {
        await signIn(username, password);
        state.loginBusy = false;
        render();
        loadConfig();
      } catch (e) {
        state.loginBusy = false;
        state.loginError = String(e.message || e);
        render();
      }
    };
    document.getElementById('signin').onclick = doSignIn;
    ['u', 'p'].forEach(function (id) {
      document.getElementById(id).onkeydown = function (ev) { if (ev.key === 'Enter') doSignIn(); };
    });
    var p = document.getElementById('p');
    if (p) p.focus();
    return;
  }

  document.getElementById('signout').onclick = function () {
    clearSession();
    state.simple = null;
    state.deep = null;
    state.runs = [];
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
    b.onclick = function () {
      state.tab = b.getAttribute('data-tab');
      render();
      if (state.tab === 'bench' && !state.bench && !state.benchTried) loadBenchFromUrl();
      /* Unlike the benchmark file, the persisted scan list goes stale the moment anyone runs a
         scan or calls the public endpoint — so refetch on every activation rather than only the
         first. API Integration reads the same GET /runs response for the key, the endpoint and
         today's usage, so it needs the fetch too. */
      if ((state.tab === 'results' || state.tab === 'api') && !state.runsBusy) loadRuns();
    };
  });

  /* ---- scan tab ---- */
  if (state.tab === 'scan') {
    on('sample', 'onchange', function (sel) {
      var i = Number(sel.value);
      state.sampleIdx = i;
      state.email = i >= 0
        ? JSON.parse(JSON.stringify(SAMPLES[i].email))
        : { from: '', subject: '', body: '', attachments: [] };
      state.uploadNote = null;
      render();
    });

    [['from', 'from'], ['subject', 'subject'], ['body', 'body']].forEach(function (pair) {
      on(pair[0], 'oninput', function (node) {
        state.email[pair[1]] = node.value;
        state.sampleIdx = -1;
      });
    });

    /* --- file upload. Reads the file as text and parses it the same way the backend parses a
           pasted email, so what the UI shows is what POST /classify would have made of it. --- */
    on('email-file', 'onchange', function (node) {
      if (node.files && node.files[0]) loadEmailFile(node.files[0]);
    });
    on('attach-file', 'onchange', function (node) {
      if (node.files && node.files.length) addAttachmentFiles(node.files);
    });

    /* Remove one attachment name, or all of them. The index comes off the button's own attribute,
       so a re-render between paint and click cannot make it point at a different row. */
    Array.prototype.forEach.call(document.querySelectorAll('[data-attach-remove]'), function (b) {
      b.onclick = function () {
        var i = Number(b.getAttribute('data-attach-remove'));
        var names = (state.email.attachments || []).slice();
        if (i >= 0 && i < names.length) names.splice(i, 1);
        state.email.attachments = names;
        state.sampleIdx = -1;
        state.uploadNote = null;
        render();
      };
    });
    on('attach-clear', 'onclick', function () {
      state.email.attachments = [];
      state.sampleIdx = -1;
      state.uploadNote = null;
      render();
    });

    on('model', 'onchange', function (sel) {
      state.modelId = sel.value;
      var m = modelById(state.modelId);
      /* Still switches away from a region this model cannot answer in -- that prevents a
         guaranteed 400 -- but it no longer narrates it. The region selector re-renders with the
         new value selected, so the change is visible without a sentence about it. */
      if (m.regions.indexOf(state.region) === -1) {
        state.region = OFFERED_REGIONS.filter(function (r) { return m.regions.indexOf(r) !== -1; })[0];
      }
      render();
    });

    on('region', 'onchange', function (sel) {
      state.region = sel.value;
      render();
    });

    on('flex', 'onchange', function (box) { state.flex = box.checked; });

    /* --- the live prompt editor. Same rule as every other text input here: oninput writes
           state and does NOT re-render, or the caret would jump to the end on every keystroke.
           The character counter is therefore one keystroke stale until the next render, which is
           the right trade — a re-render per character would make the textarea unusable. --- */
    on('prompt-body', 'oninput', function (ta) {
      var stage = state.promptStage;
      state.promptBodies[stage] = ta.value;
      state.promptEdited[stage] = ta.value !== DEFAULT_PROMPT_BODIES[stage];
    });

    on('prompt-stage', 'onchange', function (sel) {
      state.promptStage = sel.value;
      render();
    });

    on('prompt-reset', 'onclick', function () {
      var stage = state.promptStage;
      state.promptBodies[stage] = DEFAULT_PROMPT_BODIES[stage];
      state.promptEdited[stage] = false;
      render();
    });

    on('simple-btn', 'onclick', function () { runStageScan('simple'); });
    on('deep-btn', 'onclick', function () { runStageScan('deep'); });

    on('clear-scan', 'onclick', function () {
      state.simple = null;
      state.deep = null;
      state.errorSimple = null;
      state.errorDeep = null;
      state.errorClassSimple = null;
      state.errorClassDeep = null;
      render();
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-disclose]'), function (b) {
      b.onclick = function () {
        var target = document.getElementById(b.getAttribute('data-disclose'));
        if (!target) return;
        var open = target.hasAttribute('hidden');
        if (open) target.removeAttribute('hidden'); else target.setAttribute('hidden', '');
        /* The label rides on the button rather than being inferred from the id. Inferring it
           broke the moment a third disclosure existed: `prompt-appended` starts with "prompt"
           and would have relabelled itself "Hide prompt sent". */
        b.textContent = (open ? 'Hide ' : 'Show ') + (b.getAttribute('data-disclose-label') || 'detail');
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-replay]'), function (b) {
      b.onclick = function () {
        var uid = b.getAttribute('data-replay');
        var st = uid === 's1' ? state.simple : state.deep;
        playReplay(uid, st ? st.timeline : []);
      };
    });
  }

  /* ---- benchmark tab ---- */
  if (state.tab === 'bench') {
    on('bench-sample', 'onchange', function (sel) { loadBenchSample(sel.value); });
    on('bench-retry', 'onclick', loadBenchFromUrl);
    on('bench-file', 'onchange', function (node) {
      if (node.files && node.files[0]) loadBenchFromFile(node.files[0]);
    });
    on('bench-download', 'onclick', downloadBenchTemplate);
  }

  /* ---- scan results + api integration: both read GET /runs, so both wire the same things ---- */
  if (state.tab === 'results' || state.tab === 'api') {
    on('runs-refresh', 'onclick', loadRuns);
    on('clear-runs', 'onclick', function () { state.runs = []; render(); });

    /* The payload is looked up in COPY_PAYLOADS, which render() just filled — nothing is read
       back out of the DOM, so a re-render between paint and click cannot empty it. */
    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
      b.onclick = function () { copyText(b.getAttribute('data-copy')); };
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-run]'), function (tr) {
      var toggleRow = function () {
        /* The key comes off the row's own attribute and the open set lives in state, so the
           re-render below cannot lose which row was clicked. */
        var k = tr.getAttribute('data-run');
        if (state.runsOpen[k]) delete state.runsOpen[k];
        else state.runsOpen[k] = true;
        render();
      };
      tr.onclick = toggleRow;
      tr.onkeydown = function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          toggleRow();
        }
      };
    });
  }
}

/* ------------------------------------------------------------------------------ boot */

/** GET /api/models. Non-blocking on purpose: if it fails, the registry mirror keeps the
 *  dropdowns and the prompt editor honest and the warning says what happened, which is
 *  more debuggable in front of an audience than a blank page. */
async function loadConfig() {
  try {
    var cfg = await call('/models');
    state.config = cfg;
    state.configWarning = null;
    var incoming = cfg.models;
    if (Array.isArray(incoming) && incoming.length) {
      state.models = incoming.map(function (m) {
        var mirror = null;
        for (var i = 0; i < MODELS.length; i++) if (MODELS[i].id === m.id) mirror = MODELS[i];
        return {
          id: m.id,
          label: m.label || (mirror && mirror.label) || m.id,
          endpoint: m.endpoint || (mirror && mirror.endpoint) || 'runtime',
          path: m.path !== undefined ? m.path : (mirror && mirror.path) || null,
          style: m.style || (mirror && mirror.style),
          regions: Array.isArray(m.regions) ? m.regions : (mirror ? mirror.regions : ['us-east-1']),
          supportsJsonSchema: pick(m, 'supportsJsonSchema', 'supports_json_schema') === undefined
            ? !!(mirror && mirror.supportsJsonSchema) : !!pick(m, 'supportsJsonSchema', 'supports_json_schema'),
          supportsPromptCaching: !!pick(m, 'supportsPromptCaching', 'supports_prompt_caching'),
          supportsLatencyOptimized: !!pick(m, 'supportsLatencyOptimized', 'supports_latency_optimized'),
          observedLatencyMs: num(pick(m, 'observedLatencyMs', 'observed_latency_ms')),
          observedLatencyByRegionMs: pick(m, 'observedLatencyByRegionMs', 'observed_latency_by_region_ms') ||
            (mirror && mirror.observedLatencyByRegionMs) || {},
          servedVia: pick(m, 'servedVia', 'served_via') || '',
          /* Absent means verified: the registry mirror in this page only ever held verified
             models, so a server that does not send the field is an older one, not an unverified
             catalog. Only an explicit false downgrades a model. */
          verified: m.verified === false ? false : true,
          notes: m.notes || (mirror && mirror.notes) || '',
          /* Never lose the verbatim exception text: the server's copy wins, the mirror fills gaps. */
          unsupportedReason: Object.assign({}, mirror ? mirror.unsupportedReason : {},
            pick(m, 'unsupportedReason', 'unsupported_reason') || {})
        };
      });
      /* A model the server no longer offers must not stay selected, or the next scan sends
         an id the registry will silently fall back on. */
      var stillOffered = state.models.filter(function (m) { return m.id === state.modelId; }).length > 0;
      if (!stillOffered) state.modelId = state.models[0].id;
    }
    var t = cfg.targets || {};
    if (num(t.ttftMs) !== null) TARGETS.ttftMs = num(t.ttftMs);
    if (num(t.classifyP50Ms) !== null) TARGETS.classifyP50Ms = num(t.classifyP50Ms);
    if (num(t.deepScanP95Ms) !== null) TARGETS.deepScanP95Ms = num(t.deepScanP95Ms);

    /* The server's region list wins over the mirror's, so a region added or withdrawn in the
       registry reaches the selector without a frontend edit. Mutated in place because
       OFFERED_REGIONS is read by name in several places. */
    if (Array.isArray(cfg.regions) && cfg.regions.length) {
      OFFERED_REGIONS.length = 0;
      cfg.regions.forEach(function (r) { OFFERED_REGIONS.push(r); });
    }
    state.discoveryNote = cfg.discoveryNote || null;
    if (cfg.defaultRegion) DEFAULT_REGION = cfg.defaultRegion;
    if (cfg.bothLanesRegion) BOTH_LANES_REGION = cfg.bothLanesRegion;
    /* The Lambda's configured region is the truth about where a scan will actually run, so it
       wins over this page's compiled-in default — but only if the selector can offer it. */
    if (cfg.region && OFFERED_REGIONS.indexOf(cfg.region) !== -1) state.region = cfg.region;

    /* --- prompts. The editor is prefilled from the server so it shows the bytes the Lambda
           actually sends, not this page's mirror of them. A stage the user has already edited is
           left alone: /models can answer after someone has started typing, and overwriting their
           work would be the worst possible moment to be authoritative. --- */
    var pr = cfg.prompts || {};
    var bodies = pr.bodies || {};
    ['classify', 'deep-scan'].forEach(function (s) {
      if (typeof bodies[s] === 'string' && bodies[s]) {
        DEFAULT_PROMPT_BODIES[s] = bodies[s];
        if (!state.promptEdited[s]) state.promptBodies[s] = bodies[s];
      }
      var shapes = pr.jsonShapes || {};
      if (typeof shapes[s] === 'string' && shapes[s]) DEFAULT_JSON_SHAPES[s] = shapes[s];
    });
    if (typeof pr.injectionGuard === 'string' && pr.injectionGuard) INJECTION_GUARD = pr.injectionGuard;
    if (num(pr.maxOverrideChars) !== null) MAX_PROMPT_CHARS = num(pr.maxOverrideChars);

    var budgets = (cfg.budgets || {}).maxTokens || {};
    ['classify', 'deep-scan'].forEach(function (s) {
      if (num(budgets[s]) !== null) STAGE_MAX_TOKENS[s] = num(budgets[s]);
    });
  } catch (e) {
    if (e.authFailed) {
      clearSession();
      state.loginError = 'The API rejected the IdToken. Sign in again.';
    } else {
      state.configWarning = String(e.message || e);
    }
  }
  render();
}

/* The <head> script already stamped the right theme before first paint; this only syncs
   state (and the OS-change listener) so the toggle's label starts out correct. */
initTheme();

state.token = loadSession();
state.user = sessionStorage.getItem(USER_KEY);
render();
if (state.token) loadConfig();
</script>
</body>
</html>
