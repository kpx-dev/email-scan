  html += '<section class="panel"><h2>2 · Lane &amp; levers</h2>';

  /* Every Gemma model this account can see: the two verified lanes first, then whatever
     bedrock:ListFoundationModels reported. No provider name anywhere in the display label — the
     `google.` in the model ID stays, because that is the literal Bedrock identifier and sending
     anything else is a 400, but nothing shown as a NAME carries it. */
  html += '<label for="model">Model</label><select id="model">';
  state.models.forEach(function (m) {
    var suffix = m.observedLatencyMs ? ' — ~' + m.observedLatencyMs + 'ms' : '';
    if (m.verified === false) suffix = ' — discovered, unverified';
    html += '<option value="' + esc(m.id) + '"' + (m.id === state.modelId ? ' selected' : '') + '>' +
      esc(m.label) + esc(suffix) + '</option>';
  });
  html += '</select>';
  if (model.verified === false) {
    html += '<div class="warn"><strong>This model was discovered, not verified.</strong> Bedrock lists ' +
      'it for this account, which means the entitlement exists — it does not mean this PoC has ever ' +
      'called it. No latency was measured on it, only <span class="mono">' + esc(state.region) + '</span> ' +
      'was tested, and it is routed over Converse with the fence-stripping parser rather than an ' +
      'enforced schema. Treat a scan here as an experiment; the two models above it are the ones with ' +
      'numbers behind them.</div>';
  }
  if (state.discoveryNote) {
    html += '<div class="muted small">' + esc(state.discoveryNote) + '</div>';
  }
  html += '<label for="region">Region</label><select id="region">';
  OFFERED_REGIONS.forEach(function (rg) {
    var ok = model.regions.indexOf(rg) !== -1;
    var per = (model.observedLatencyByRegionMs || {})[rg];
    var suffix = ok
      ? (rg === DEFAULT_REGION ? ' — EU default' : '') + (per ? ' · ~' + per + 'ms measured' : '')
      : ' — not available for this model';
    html += '<option value="' + esc(rg) + '"' + (rg === state.region ? ' selected' : '') +
      (ok ? '' : ' disabled') +
      (ok ? '' : ' title="' + esc(reasonFor(model, 'region:' + rg)) + '"') +
      '>' + esc(rg) + esc(suffix) + '</option>';
  });
  html += '</select>';
  /* No prose under the selector. The per-option suffixes carry what is left of it, and a greyed
     option still shows the verbatim exception on hover -- the title attribute, not visible text. */

  /* service_tier: framed as cost, because the measurement says it is not a latency lever */
  html += '<label class="check" title="Real and accepted by the endpoint. It halves token cost. It is NOT reliably faster: measured 1563 ms with flex against 961–1024 ms default, so this is a cost lever and is framed as one.">' +
    '<input type="checkbox" id="flex"' + (state.flex ? ' checked' : '') + '>' +
    /* One span, deliberately. label.check is display:flex, so a bare text node plus a
       <strong> sibling become two flex items and lay out as ragged columns instead of a
       sentence. Wrapping the whole phrase makes it one flex item that wraps normally. */
    '<span>service_tier: flex — <strong>halves token cost</strong> (not a latency lever)</span></label>';
  html += '<div class="muted small">Measured 1 563 ms flex vs 961–1 024 ms default. Doc §6.1a implies latency; ' +
    'the measurement says cost.</div>';

  /* the two greyed levers, with the verbatim exception on hover */
  html += '<div class="toggle-off" title="' + esc(reasonFor(model, 'prompt_caching')) + '">' +
    '<input type="checkbox" disabled> Prompt caching <span class="na">unsupported</span></div>';
  html += '<div class="muted small" title="' + esc(reasonFor(model, 'prompt_caching_ttl') || reasonFor(model, 'prompt_caching')) + '">' +
    'hover for the verbatim ' + (model.endpoint === 'mantle' ? 'measurement' : 'AccessDeniedException') + '</div>';
  html += '<div class="toggle-off" title="' + esc(reasonFor(model, 'latency_optimized')) + '">' +
    '<input type="checkbox" disabled> performanceConfig latency=optimized <span class="na">unsupported</span></div>';
  html += '<div class="muted small" title="' + esc(reasonFor(model, 'latency_optimized')) + '">' +
    'hover for the verbatim ValidationException</div>';
  html += '<div class="muted small">Neither is needed to beat the target, and neither is ever sent on the wire: ' +
    'cachePoint hard-fails on Gemma 3 and performanceConfig is refused for every candidate in us-east-1.</div>';

  html += promptEditor(model);

  /* --- the two buttons. One stage each, one request each, so the latency on each card is
         that stage alone rather than a pipeline total with the other stage folded in. --- */
  var busy = state.busySimple || state.busyDeep;
  html += '<div class="actions" style="margin-top:14px">';
  html += '<button class="primary" id="simple-btn"' + (busy ? ' disabled' : '') + '>' +
    (state.busySimple ? 'Simple scanning…' : 'Simple Scan') + '</button>';
  html += '<button class="primary" id="deep-btn"' + (busy ? ' disabled' : '') + '>' +
    (state.busyDeep ? 'Deep scanning…' : 'Deep Scan') + '</button>';
  html += '<button id="clear-scan"' + (busy ? ' disabled' : '') + '>clear results</button></div>';
  html += '<div class="muted small"><strong>Simple Scan</strong> → <span class="mono">POST ' +
    esc(API_BASE) + '/classify</span>, maxTokens ' + STAGE_MAX_TOKENS.classify + ', target TTFT &lt;' +
    TARGETS.ttftMs + ' ms and E2E P50 &lt;' + TARGETS.classifyP50Ms + ' ms. Returns the server’s ' +
    'gate decision as well, without running Stage 2.</div>';
  html += '<div class="muted small"><strong>Deep Scan</strong> → <span class="mono">POST ' +
    esc(API_BASE) + '/deep-scan</span>, maxTokens ' + STAGE_MAX_TOKENS['deep-scan'] + ', target E2E ' +
    'P95 &lt;' + TARGETS.deepScanP95Ms + ' ms. Standalone: it gets no Stage 1 context, because a ' +
    'client-supplied prior classification would put the deep scan’s premise in the caller’s hands. ' +
    'The threaded-in version is what <span class="mono">/scan</span> runs.</div>';

  html += '</section>';

  /* -------------------------------------------------------------- column 3: results */
  html += '<section class="panel"><h2>3 · Results</h2>';

  if (state.configWarning) {
    html += '<div class="warn"><strong>GET ' + esc(API_BASE) + '/models did not answer.</strong> ' +
      esc(state.configWarning) +
      '<div class="muted">Falling back to the registry mirror baked into this page, so the dropdowns and ' +
      'the prompt editor still render — but the editor is then prefilled from the mirror rather than from ' +
      'the server, and a scan will probably fail the same way.</div></div>';
  }

  if (!state.simple && !state.deep && !state.busySimple && !state.busyDeep &&
      !state.errorSimple && !state.errorDeep) {
    html += '<p class="muted">Pick a sample, then press <strong>Simple Scan</strong> or ' +
      '<strong>Deep Scan</strong>. Each button runs one stage in one request, so the latency on each ' +
      'card is that stage alone. Simple Scan also returns what the server-side gate decided, which is ' +
      'what tells you whether the deep stage is warranted at all.</p>';
  }

  html += scanCard('simple');
  if (state.simple) html += escalationArrow(state.simple);
  html += scanCard('deep');
  html += scanCompare(state.simple, state.deep);

  /* The run history lives on SCAN RESULTS, not here. This column is the two results you just
     asked for; a growing table underneath them pushed them off the screen. */
  if (state.runs.length) {
    html += '<div class="muted small" style="margin-top:12px">' +
      esc(state.runs.length.toLocaleString()) + ' scan(s) this session. Percentiles and the full ' +
      'persisted history are on the <strong>SCAN RESULTS</strong> tab.</div>';
  }
  html += '</section>';

  html += '</div>';
  return html;
}

/* --------------------------------------------------------------------- file upload */

/** Split raw email text into {from, to, subject, body}.
 *
 *  A direct port of backend/handler.parse_pasted_email, and it has to stay one: this is what
 *  makes the fields the upload fills identical to what the API would have derived from the same
 *  bytes. Only LEADING From/To/Subject lines are consumed, and only until the first line that is
 *  not one of them. A header-looking line inside the body stays in the body — the input is
 *  adversarial by definition here, and hoisting a `Subject:` planted three paragraphs down would
 *  let a sender rewrite the field the analyst reads.
 */
function parsePastedEmail(text) {
  var email = { from: '', to: '', subject: '', body: '' };
  var lines = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  var re = /^(from|to|subject)\s*:\s*(.*)$/i;

  var index = 0;
  for (; index < lines.length; index++) {
    var m = re.exec(lines[index]);
    if (!m) break;
    email[m[1].toLowerCase()] = m[2].trim();
  }

  var body = lines.slice(index).join('\n');
  var sawHeader = !!(email.from || email.to || email.subject);
  email.body = sawHeader ? body.replace(/^\n+/, '') : body;
  return email;
}

/* A browser will happily read a 200 MB file into a string and then hand it to the API, where it
   becomes a 413 or a very expensive scan. Refused here, with the size named. */
var MAX_UPLOAD_BYTES = 1024 * 1024;

/** Load an email from a file: .json as a structured email, anything else as raw text. */
function loadEmailFile(file) {
  if (file.size > MAX_UPLOAD_BYTES) {
    state.uploadError = true;
    state.uploadNote = file.name + ' is ' + Math.round(file.size / 1024).toLocaleString() +
      ' KB, over the ' + (MAX_UPLOAD_BYTES / 1024) + ' KB ceiling. Doc §2.4 specifies 2–5 KB of ' +
      'header and body text; a file this size is not an email, and every character of it would be ' +
      'billed as input.';
    render();
    return;
  }

  var reader = new FileReader();
  reader.onerror = function () {
    state.uploadError = true;
    state.uploadNote = 'The browser could not read ' + file.name + '.';
    render();
  };
  reader.onload = function () {
    var text = String(reader.result || '');
    var isJson = /\.json$/i.test(file.name);

    if (isJson) {
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (e) {
        state.uploadError = true;
        state.uploadNote = file.name + ' is not valid JSON: ' + String(e.message || e) +
          ' — rename it to .txt to load it as raw email text instead.';
        render();
        return;
      }
      /* Accept the request shape itself, so a file saved from the API examples loads directly. */
      var em = (parsed && typeof parsed.email === 'object' && parsed.email) ? parsed.email : parsed;
      if (typeof em === 'string') {
        em = parsePastedEmail(em);
      } else if (!em || typeof em !== 'object') {
        state.uploadError = true;
        state.uploadNote = file.name + ' parsed as JSON but carries no email object.';
        render();
        return;
      }
      state.email = {
        from: String(em.from || ''),
        subject: String(em.subject || ''),
        body: String(em.body || em.text || ''),
        attachments: Array.isArray(em.attachments)
          /* Tolerate [{name}] as well as ["name"]: both shapes appear in the wild and in the
             API examples, and silently dropping one would look like the upload lost data. */
          ? em.attachments.map(function (a) {
              return typeof a === 'string' ? a : String((a && a.name) || '');
            }).filter(function (s) { return s.length > 0; })
          : []
      };
      state.uploadError = false;
      state.uploadNote = 'Loaded ' + file.name + ' as a structured email' +
        (state.email.attachments.length ? ' with ' + state.email.attachments.length + ' attachment name(s)' : '') + '.';
    } else {
      var parsedEmail = parsePastedEmail(text);
      if (!parsedEmail.body && !parsedEmail.subject) {
        state.uploadError = true;
        state.uploadNote = file.name + ' is empty, so there is nothing to scan.';
        render();
        return;
      }
      state.email = {
        from: parsedEmail.from,
        subject: parsedEmail.subject,
        body: parsedEmail.body,
        /* Attachment names are not recoverable from a text file, so the existing list is kept
           rather than cleared — clearing it would silently discard names already typed in. */
        attachments: state.email.attachments || []
      };
      state.uploadError = false;
      state.uploadNote = 'Loaded ' + file.name + ' — ' +
        (parsedEmail.from || parsedEmail.subject
          ? 'headers split off the top and the rest kept as the body.'
          : 'no leading From/To/Subject headers found, so the whole file is the body. That is the ' +
            'correct reading of a pasted fragment, not a parse failure.');
    }

    /* No longer one of the corpus samples. */
    state.sampleIdx = -1;
    render();
  };
  reader.readAsText(file);
}

/** Add picked files to the attachment list, by NAME. Nothing binary is read. */
function addAttachmentFiles(files) {
  var names = state.email.attachments ? state.email.attachments.slice() : [];
  var added = [];
  Array.prototype.forEach.call(files, function (f) {
    if (names.indexOf(f.name) === -1) {
      names.push(f.name);
      added.push(f.name);
    }
  });
  state.email.attachments = names;
  state.sampleIdx = -1;
  state.uploadError = false;
  state.uploadNote = added.length
    ? 'Added ' + added.length + ' attachment name(s): ' + added.join(', ') +
      '. The file contents were not read and are not sent.'
    : 'Those attachment names are already on the list.';
  render();
}

/* ------------------------------------------------------------------- scan execution */

/** The request body both buttons send. One function so the two scans cannot drift apart on
 *  which model, region, tier or prompt they used — which would silently void the comparison. */
function scanRequest(stage) {
  return {
    email: {
      from: state.email.from,
      subject: state.email.subject,
      body: state.email.body,
      attachments: state.email.attachments || []
    },
    modelId: state.modelId,
    region: state.region,
    serviceTier: state.flex ? 'flex' : null,
    /* The instruction body only. The server appends the JSON shape and the injection guard to
       it, so this cannot delete either — see prompts.system_for. Sent only when it differs from
       the default, so an untouched editor produces a byte-identical request to before. */
    systemPrompt: state.promptEdited[stage] ? state.promptBodies[stage] : undefined
  };
}

/** Run one stage. `slot` is 'simple' | 'deep'; the two slots are independent, so a Deep Scan
 *  failure leaves an existing Simple Scan result on screen instead of blanking it. */
async function runStageScan(slot) {
  var isSimple = slot === 'simple';
  var stage = isSimple ? 'classify' : 'deep-scan';
  var path = isSimple ? '/classify' : '/deep-scan';
  var uid = isSimple ? 's1' : 's2';

  if (isSimple) { state.busySimple = true; state.errorSimple = null; state.errorClassSimple = null; }
  else { state.busyDeep = true; state.errorDeep = null; state.errorClassDeep = null; }
  render();

  try {
    var body = await call(path, scanRequest(stage));
    var st = normSingle(body, stage);
    if (isSimple) state.simple = st; else state.deep = st;
    if (st) recordRun(st);
  } catch (e) {
    if (e.authFailed) {
      clearSession();
      state.loginError = 'Session expired or rejected by the API Gateway JWT authorizer. Sign in again.';
      state.busySimple = false;
      state.busyDeep = false;
      render();
      return;
    }
    if (isSimple) {
      state.simple = null;
      state.errorSimple = String(e.message || e);
      state.errorClassSimple = e.errorClass || null;
    } else {
      state.deep = null;
      state.errorDeep = String(e.message || e);
      state.errorClassDeep = e.errorClass || null;
    }
  } finally {
    if (isSimple) state.busySimple = false; else state.busyDeep = false;
  }
  render();
  var done = isSimple ? state.simple : state.deep;
  if (done) playReplay(uid, done.timeline);
}

/* ======================================================= TAB 2 — BENCHMARK =========== */

/** The three-way taxonomy. Design 8.3's whole point is that these are never collapsed into
 *  one error rate: a saturated load generator is not a Bedrock limit.
 *
 *  driver.py emits each bucket as {errorClassName: count}, not as an integer — so a naive
 *  Number() on it yields NaN, the count reads 0, and the red banner never fires on the one
 *  run that most needs it. Sum the counts, and keep the per-class breakdown, which is what
 *  tells you ConnectionResetError from ReadTimeoutError. */
function bucketCount(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (typeof v === 'object') {
    var total = 0;
    Object.keys(v).forEach(function (k) { total += num(v[k]) || 0; });
    return total;
  }
  return num(v) || 0;
}

function bucketDetail(v) {
  if (!v || typeof v !== 'object') return '';
  return Object.keys(v).map(function (k) { return k + '=' + v[k]; }).join(', ');
}

function buckets(o) {
  var b = pick(o || {}, 'errorsByBucket', 'errorBuckets', 'errors_by_bucket', 'buckets') || {};
  return {
    service_throttle: bucketCount(pick(b, 'service_throttle', 'serviceThrottle', 'throttle')),
    client_transport: bucketCount(pick(b, 'client_transport', 'clientTransport', 'transport')),
    application: bucketCount(pick(b, 'application', 'app')),
    raw: b
  };
}

/** Escalation rate, however the file spells it. driver.py nests it under escalation.ratePct
 *  and it is already a percentage; a bare 0-1 fraction is also accepted. */
function escalationPct(o) {
  var esc = (o || {}).escalation;
  var v = esc ? num(pick(esc, 'ratePct', 'rate_pct', 'rate')) : num(pick(o || {}, 'escalationRate', 'escalation_rate'));
  if (v === null) return null;
  return v <= 1 ? v * 100 : v;
}

var BUCKET_MEANING = {
  service_throttle: 'HTTP 429, 503, ThrottlingException. A real Bedrock capacity limit — back off, and it is a legitimate quota data point.',
  client_transport: 'ConnectionReset, ReadTimeout, NewConnectionError, EndpointConnectionError. Our load generator saturated, not Bedrock. Never report as a service limit.',
  application: '4xx validation or schema-parse failure. A bug in our request or prompt.'
};

function barRow(label, value, max, unit, verdict, target) {
  var v = num(value);
  var w = (v === null || !max) ? 0 : Math.max(1, Math.min(100, (v / max) * 100));
  var html = '<div class="barrow"><span class="barlabel">' + esc(label) + '</span>';
  html += '<span class="bartrack"><span class="barfill' + (verdict ? ' ' + verdict : '') + '" style="width:' + w.toFixed(1) + '%"></span>';
  if (target && max) {
    html += '<span class="bartarget" style="left:' + Math.min(100, (target / max) * 100).toFixed(1) + '%" title="target ' + esc(target) + esc(unit) + '"></span>';
  }
  html += '</span>';
  html += '<span class="barval">' + (v === null ? '—' : esc(v.toLocaleString()) + esc(unit)) + '</span></div>';
  return html;
}

function percentileBars(title, obj, targetMs) {
  var p50 = num(pick(obj || {}, 'p50', 'P50')), p95 = num(pick(obj || {}, 'p95', 'P95')), p99 = num(pick(obj || {}, 'p99', 'P99'));
  var max = Math.max(p50 || 0, p95 || 0, p99 || 0, targetMs || 0) * 1.1 || 1;
  var html = '<h3>' + esc(title) + '</h3><div class="bars">';
  html += barRow('P50', p50, max, ' ms', p50 !== null && targetMs ? (p50 <= targetMs ? 'pass' : 'fail') : '', targetMs);
  html += barRow('P95', p95, max, ' ms', p95 !== null && targetMs ? (p95 <= targetMs ? 'pass' : 'fail') : '', targetMs);
  html += barRow('P99', p99, max, ' ms', p99 !== null && targetMs ? (p99 <= targetMs ? 'pass' : 'fail') : '', targetMs);
  html += '<div class="legend">dashed line = target ' + esc(targetMs ? targetMs.toLocaleString() + ' ms' : 'n/a') +
    ' · nearest-rank percentiles with ceil, the same algorithm this page uses for the session strip</div></div>';
  return html;
}

function benchSampleByKey(key) {
  for (var i = 0; i < BENCH_SAMPLES.length; i++) if (BENCH_SAMPLES[i].key === key) return BENCH_SAMPLES[i];
  return null;
}

/** The source controls: built-in dropdown, retry, local file. One function so the empty state
 *  and the loaded view cannot drift apart — and so only one `id="bench-retry"` per render. */
function benchSourceControls() {
  var sel = benchSampleByKey(state.benchSampleKey);
  var html = '<label for="bench-sample">Built-in run</label><select id="bench-sample">';
  html += '<option value=""' + (sel ? '' : ' selected') + '>— pick a run to chart —</option>';
  BENCH_SAMPLES.forEach(function (s) {
    /* The measured/illustrative marker rides on the option text, not only on the panel that
       appears after selection — a visitor has to be able to tell before they pick. */
    html += '<option value="' + esc(s.key) + '"' + (state.benchSampleKey === s.key ? ' selected' : '') + '>' +
      esc(s.label) + (s.measured ? ' — measured' : ' — illustrative') + '</option>';
  });
  html += '</select>';
  html += '<div class="muted small">' + (sel ? esc(sel.note) :
    'Four files that between them exercise every branch this tab draws: a clean pass, a lane ' +

    'Two are measured harness output from <code>bench/results/</code>; two are marked ' +
    'illustrative and say so wherever they are shown.') + '</div>';
  html += '<div class="actions">' +
    '<button id="bench-retry">' + (state.bench ? 'Reload' : 'Retry') + ' /results.json</button>' +

    '</div>';
  html += '<div class="muted small">The download is a documented template: every field this tab ' +
    'reads, with a <span class="mono">_README</span> block naming which are required and which are ' +
    'optional, and the accepted snake_case aliases. Fill it from your own harness, or run ' +
    '<span class="mono">bench/driver.py</span> and upload what it writes.</div>';
  return html;
}

/** A documented results.json template, downloaded so the required shape is discoverable without
 *  reading driver.py. Built from a real measured run rather than from invented numbers, then
 *  annotated -- so someone who fills it in has a working file to diff against.
 *
 *  The `_README` keys are ignored by benchTab(): the loader reads named fields and never iterates
 *  the object, so documentation can live inside the file it documents. */
function benchTemplate() {
  var measured = benchSampleByKey('fallback-clean');
  var t = JSON.parse(JSON.stringify(measured.data));
  return {
    _README: {
      what: 'Template for the Benchmark tab. Values below are a real measured run ' +
        '(bench/results/results.json, 2026-09-12) so the file is valid as-is; replace them.',
      required: {
        'totals or summary': 'object holding ttftMs/e2eMs percentile objects and errorsByBucket',
        'totals.ttftMs': '{p50, p95, p99} in milliseconds. Missing percentiles render as em-dashes, not zeros',
        'totals.e2eMs': '{p50, p95, p99} in milliseconds',
        'totals.errorsByBucket': 'the three buckets, ALWAYS separate: service_throttle, ' +
          'client_transport, application. Each is either an integer or {ErrorClassName: count}; ' +
          'both are accepted and the per-class breakdown is rendered when present'
      },
      optional: {
        'run': 'lane, endpoint, path, modelId, modelLabel, region, stage, serviceTier, ' +
          'jsonSchemaSent, sdkAttempts, warmupSeconds, throughVia — rendered in the Run table',
        'steps[]': 'per-concurrency rows: concurrency, requests, achievedRps, errorRatePct, ' +
          'errorsByBucket, escalation. Without this there is no RPS-vs-concurrency chart',
        'targets': 'ttftMs and classifyP50Ms (stage1E2eP50Ms is accepted too). The pass/fail ' +
          'lines come from the FILE, so they are the harness\'s own targets, not this page\'s guess',
        'totals.bedrockLatencyMs': 'omit it on a lane that reports no server-side latency. ' +
          'The tab then says "n/a on this lane" — never 0, which would read as infinitely fast',
        'totals.escalation': '{ratePct, escalated, parsed, reasons{}} — the escalation rate is ' +
          'the single most valuable number the harness produces',
        percentileMethod: 'a string, shown verbatim. This repo uses nearest-rank with ceil',
        generatedAt: 'ISO-8601, shown verbatim'
      },
      aliases: 'snake_case is accepted throughout: totals/summary/aggregate, e2e_ms/e2eMs, ' +
        'achieved_rps/achievedRps, error_rate_pct/errorRatePct, and so on.',
      warning: 'A non-empty client_transport bucket VOIDS the run: it means the load generator ' +
        'saturated, not Bedrock, and the tab prints no pass/fail verdict for such a run. Never ' +
        'collapse the three buckets into one error rate.'
    },
    schemaVersion: t.schemaVersion,
    generatedAt: t.generatedAt,
    percentileMethod: t.percentileMethod,
    run: t.run,
    targets: t.targets,
    steps: t.steps,
    totals: t.totals
  };
}

/** Trigger a client-side download. No network: the file is built in the page and handed to the
 *  browser as a blob, so this works on a site where nothing is uploaded next to the SPA. */
function downloadBenchTemplate() {
  var text = JSON.stringify(benchTemplate(), null, 2);
  try {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'results.sample.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    /* Revoked on a timer rather than immediately: some browsers have not finished reading the
       blob when click() returns, and revoking early yields an empty file. */
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  } catch (e) {
    /* A refused download is worth saying out loud rather than doing nothing visible. */
    state.benchError = 'The browser refused the download: ' + String(e.message || e) +
      ' — the same template is in bench/results/results.json in the repo.';
    render();
  }
}

function benchEmptyState() {
  var html = '<section class="panel"><h2>Benchmark</h2>';
  html += '<p class="muted">No <code>results.json</code> has been loaded yet, so there is nothing to chart. ' +
    'This tab renders the harness output; it never calls Bedrock itself. Pick a built-in run below, ' +
    'or load a file the harness produced.</p>';
  if (state.benchError) {
    html += '<div class="warn"><strong>Tried <code>/results.json</code> at the site root and could not use it.</strong> ' +
      esc(state.benchError) +
      '<div class="muted">A CloudFront-returned HTML shell shows up here as an excerpt rather than as ' +
      '“Unexpected token &lt;”, which is the point of the excerpt.</div>';
    /* 403 on this path is the expected answer on a fresh deploy, not a misconfiguration, and
       saying which of the two it is saves a pointless dig through the bucket policy. */
    if (/\b403\b|AccessDenied/i.test(state.benchError)) {
      html += '<div class="muted"><strong>A 403 here almost certainly means the object is absent, not that ' +
        'permissions are wrong.</strong> <code>deploy.sh</code> uploads <code>index.html</code> and nothing ' +
        'else, so <code>results.json</code> is only there if someone put it there. The OAC bucket policy ' +
        'grants <span class="mono">s3:GetObject</span> alone — with no <span class="mono">s3:ListBucket</span>, ' +
        'S3 answers a missing key <span class="mono">403 AccessDenied</span> rather than 404, and this ' +
        'distribution deliberately carries no <span class="mono">custom_error_response</span> to rewrite it. ' +
        'Upload the file with the command below, or use a built-in run.</div>';
    }
    html += '</div>';
  }
  html += '<h3>Built-in runs</h3>';
  html += benchSourceControls();
  html += '<h3>How to produce one</h3>';
  html += '<pre class="mono" style="background:var(--panel-2);border:1px solid var(--line);' +
    'border-radius:8px;padding:12px;overflow-x:auto;line-height:1.5">' +
    esc('# the harness calls Bedrock directly, never through this web app, so its numbers\n' +
      '# carry zero API Gateway distortion\n' +
      'export AWS_PROFILE=aws\n' +
      'python3.12 bench/driver.py --model google.gemma-4-26b-a4b --lane mantle \\\n' +
      '    --region us-east-1 --steps 25,40 --duration 60 --out bench/results/results.json\n\n' +
      '# then either upload it next to the SPA:\n' +
      'aws s3 cp bench/results/results.json s3://email-scan-frontend-123456789012/results.json\n' +
      '# or just load it from disk with the picker above') +
    '</pre>';
  html += '<div class="muted small">Per-worker concurrency guidance from design §6.4: cap the mantle lane at 40 ' +
    'and the runtime lane at 150. Above that the <em>client</em> transport fails, not Bedrock.</div>';
  html += '</section>';
  return html;
}

function benchTab() {
  if (!state.bench) return benchEmptyState();

  var b = state.bench;
  var run = b.run || {};
  var summary = pick(b, 'totals', 'summary', 'aggregate') || b;
  var steps = pick(b, 'steps', 'phases', 'ramp') || [];
  /* `run.steps` is the *requested* concurrency list; `results.steps` is the measured rows.
     Only the latter is an array of objects. */
  if (!Array.isArray(steps) || (steps.length && typeof steps[0] !== 'object')) steps = [];

  /* Targets travel with the file, so the pass/fail lines are the harness's own, not this
     page's guess at them. */
  var fileTargets = b.targets || {};
  var ttftTarget = num(pick(fileTargets, 'ttftMs')) || TARGETS.ttftMs;
  /* driver.py spells this `stage1E2eP50Ms`; GET /api/models spells it `classifyP50Ms`. Both are
     3 000 ms today, so omitting the alias looked correct — and would silently stop honouring the
     file the moment the harness target moved. */
  var e2eTarget = num(pick(fileTargets, 'classifyP50Ms', 'stage1E2eP50Ms')) || TARGETS.classifyP50Ms;

  var total = buckets(summary);
  var totalErrors = total.service_throttle + total.client_transport + total.application;

  /* driver.py stops the ramp the moment either failing bucket is non-empty, so the last
     step is the informative one for the achieved-RPS headline. */
  var bestRps = null;
  steps.forEach(function (s) {
    var r = num(pick(s, 'achievedRps', 'achieved_rps', 'rps'));
    if (r !== null && (bestRps === null || r > bestRps)) bestRps = r;
  });

  var html = '';

  /* --- illustrative-data banner. Above the verdict banners on purpose: whether these numbers
         came from a real run outranks what they say. --- */
  var picked = benchSampleByKey(state.benchSampleKey);
  if (picked && !picked.measured) {
    html += '<div class="warn"><strong>Illustrative data — nothing below was measured.</strong> ' +
      '“' + esc(picked.label) + '” is a hand-written file that ships in this page to demonstrate ' +
      'how the harness reports a failure mode. Do not quote any number on this screen. The two ' +
      'built-in runs marked “measured” in the dropdown are verbatim harness output.</div>';
  }

  /* --- the red banner. Non-empty client_transport voids the verdict, always. --- */
  if (total.client_transport > 0) {
    html += '<div class="danger"><strong>' + esc(total.client_transport.toLocaleString()) +
      ' client-transport errors in this run — our load generator saturated, not Bedrock.</strong>' +
      '<div class="muted">No pass/fail verdict is printed for a run whose client-transport bucket is non-empty ' +
      '(design §8.3). Across every load test in this account <code>InvocationThrottles</code> stayed at zero, ' +
      'so a number reported here as a service limit would be wrong. Add generator capacity — cap per-worker ' +
      'concurrency at 40 on mantle, 150 on runtime — and re-run.</div></div>';
  } else {
    html += '<div class="ok"><strong>Client-transport bucket empty.</strong> ' +
      'Every request that failed, if any, failed for a reason attributable to Bedrock or to our request — ' +
      'so this run’s numbers are quotable.</div>';
  }

  html += '<div class="cols">';

  /* --- run header --- */
  html += '<section class="panel"><h2>Run</h2><table class="mini"><tbody>';
  var escPct = escalationPct(summary);
  [
    ['source', state.benchSource || 'loaded'],
    ['generated', pick(b, 'generatedAt', 'generated_at', 'startedAt') || '—'],
    ['lane', (pick(run, 'lane', 'endpoint') || '—') + (run.path ? ' ' + run.path : '')],
    ['model', pick(run, 'modelLabel', 'modelId', 'model', 'model_id') || '—'],
    ['region', pick(run, 'region') || '—'],
    ['stage', pick(run, 'stage') || '—'],
    ['service_tier', pick(run, 'serviceTier', 'service_tier') || 'default'],
    ['json_schema sent', run.jsonSchemaSent === undefined ? '—' : (run.jsonSchemaSent ? 'yes' : 'no — prompt-enforced, fence parser in play')],
    ['requests', fmt(pick(summary, 'requests', 'count', 'n'))],
    ['peak achieved RPS', bestRps === null ? '—' : fmt(bestRps) + ' (single client)'],
    ['output tok/s', fmt(pick(summary, 'outputTokensPerSec', 'outputTokensPerSecond', 'output_tokens_per_second'))],
    ['escalation rate', escPct === null ? '—' : escPct.toFixed(1) + '%'],
    ['errors', fmt(totalErrors) + (num(pick(summary, 'errorRatePct')) !== null ? ' (' + fmt(pick(summary, 'errorRatePct')) + '%)' : '')],
    ['SDK attempts', pick(run, 'sdkAttempts', 'sdk_attempts') || '—'],
    ['warm-up discarded', (pick(run, 'warmupSeconds', 'warmup_seconds') || '?') + ' s per step'],
    ['called via', pick(run, 'throughVia', 'through_via') || 'bedrock direct'],
    ['percentile method', pick(b, 'percentileMethod', 'percentile_method') || '—']
  ].forEach(function (row) {
    html += '<tr><td class="muted">' + esc(row[0]) + '</td><td>' + esc(row[1]) + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="muted small">The escalation rate is the single most valuable number this PoC produces: ' +
    'it drives both the quota ask and the cost model (design §9.3).</div>';

  /* Which gate clause actually fired, across the whole corpus. This is the evidence behind
     the escalation rate rather than just the number. */
  var reasons = (summary.escalation && summary.escalation.reasons) || null;
  if (reasons && Object.keys(reasons).length) {
    html += '<h3>Escalation reasons</h3><table class="mini"><thead><tr><th>Gate reason</th>' +
      '<th class="num">Count</th></tr></thead><tbody>';
    Object.keys(reasons).forEach(function (k) {
      html += '<tr><td class="mono">' + esc(k) + '</td><td class="num">' + esc(reasons[k]) + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="muted small">Server-side reasons, verbatim. A run dominated by ' +
      '<span class="mono">url_present_despite_benign</span> is the belt-and-braces clause earning ' +
      'its place rather than the model driving the rate.</div>';
  }
  html += benchSourceControls();
  html += '</section>';

  /* --- percentile bars --- */
  html += '<section class="panel"><h2>Latency percentiles</h2>';
  html += percentileBars('TTFT', pick(summary, 'ttftMs', 'ttft', 'ttft_ms'), ttftTarget);
  html += percentileBars('E2E', pick(summary, 'e2eMs', 'e2e', 'e2e_ms'), e2eTarget);
  var srv = pick(summary, 'bedrockLatencyMs', 'bedrockLatency', 'bedrock_latency');
  if (srv) {
    html += percentileBars('Bedrock server-side latency', srv, 0);
    html += '<div class="muted small">Server-side latency being flat as offered load rises is the licence ' +
      'to extrapolate horizontally (design §8.4 step 1) — measured p50 2 289 → 2 251 ms and p95 3 249 → ' +
      '3 234 ms while load rose 50%.</div>';
  } else {
    html += '<h3>Bedrock server-side latency</h3><div class="muted small">' +
      '<strong>n/a on this lane.</strong> The OpenAI-shape mantle response carries no equivalent of ' +
      'Converse’s metadata.metrics.latencyMs, so there is nothing to plot — expected, not missing data. ' +
      'The same gap means <code>AWS/Bedrock</code> emits 0 CloudWatch metrics for ' +
      '<span class="mono">google.gemma-4-26b-a4b</span> against 14 for ' +
      '<span class="mono">google.gemma-3-27b-it</span>, so the CloudWatch cross-check exists only on the ' +
      'fallback lane (design §8.5, risk R3).</div>';
  }
  html += '<div class="muted small">Percentiles here mix concurrency levels; quote the per-step rows below ' +
    'for a single load point.</div>';
  html += '</section>';

  /* --- RPS vs concurrency --- */
  html += '<section class="panel"><h2>Achieved RPS vs concurrency</h2>';
  if (steps.length) {
    var maxRps = 1;
    steps.forEach(function (s) {
      var r = num(pick(s, 'achievedRps', 'achieved_rps', 'rps')) || 0;
      if (r > maxRps) maxRps = r;
    });
    html += '<div class="bars">';
    steps.forEach(function (s) {
      var c = pick(s, 'concurrency', 'workers', 'c');
      var r = num(pick(s, 'achievedRps', 'achieved_rps', 'rps'));
      var sb = buckets(s);
      var bad = sb.client_transport > 0;
      var throttled = sb.service_throttle > 0;
      var reqs = num(pick(s, 'requests', 'count', 'n')) || 0;
      var errRate = num(pick(s, 'errorRatePct', 'error_rate_pct'));
      if (errRate === null && reqs) {
        errRate = ((sb.service_throttle + sb.client_transport + sb.application) / reqs) * 100;
      }
      var stepEsc = escalationPct(s);
      html += barRow('c = ' + fmt(c), r, maxRps * 1.1, ' rps', bad || throttled ? 'fail' : 'pass', 0);
      html += '<div class="legend" style="margin:-3px 0 6px 100px">' +
        esc(fmt(reqs)) + ' req · ' +
        (errRate === null ? '' : esc(errRate.toFixed(2)) + '% errors · ') +
        (stepEsc === null ? '' : esc(stepEsc.toFixed(1)) + '% escalated · ') +
        'throttle ' + sb.service_throttle + ' · transport ' + sb.client_transport + ' · app ' + sb.application +
        (bad ? ' — <span style="color:var(--crit)">client-side, not a service limit</span>' : '') +
        (throttled ? ' — <span style="color:var(--crit)">real Bedrock throttling: a quota data point</span>' : '') +
        '</div>';
    });
    html += '</div>';
    /* driver.py breaks the ramp on the first failing bucket, so say so rather than letting
       a short ramp look like an arbitrary choice. */
    var lastStep = steps[steps.length - 1];
    var lastB = buckets(lastStep);
    if (lastB.client_transport > 0 || lastB.service_throttle > 0) {
      html += '<div class="muted small">The ramp stopped at concurrency ' +
        esc(fmt(pick(lastStep, 'concurrency', 'workers'))) + ': the harness halts on the first ' +
        (lastB.service_throttle > 0
          ? 'service throttle, because that is a real capacity ceiling worth recording rather than pushing through.'
          : 'client-transport failure, because higher steps would measure our laptop rather than Bedrock.') +
        '</div>';
    }
    html += '<div class="muted small">Design §6.4 measured the single-client ceiling at 40 concurrent / 38 RPS on ' +
      'mantle and 150 / 62 RPS on runtime. Above that the client’s transport fails while server-side latency ' +
      'stays flat — which is the licence to extrapolate horizontally rather than a capacity finding.</div>';
  } else {
    html += '<p class="muted">This file has no per-step ramp data (<code>steps[]</code>), so there is no ' +
      'RPS-vs-concurrency curve to draw. Run the harness with <code>--steps</code> to produce one.</p>';
  }
  html += '</section>';

  /* --- error taxonomy --- */
  html += '<section class="panel"><h2>Error taxonomy</h2>';
  html += '<table class="mini"><thead><tr><th>Bucket</th><th class="num">Count</th><th>By error class</th>' +
    '<th>Means</th></tr></thead><tbody>';
  ['service_throttle', 'client_transport', 'application'].forEach(function (k) {
    var hot = k === 'client_transport' && total[k] > 0;
    var detail = bucketDetail(total.raw[k]);
    html += '<tr' + (hot ? ' class="hi"' : '') + '><td class="mono">' + esc(k) + '</td>' +
      '<td class="num"' + (hot ? ' style="color:var(--crit);font-weight:600"' : '') + '>' + esc(total[k].toLocaleString()) + '</td>' +
      '<td class="mono small">' + esc(detail || '—') + '</td>' +
      '<td class="muted">' + esc(BUCKET_MEANING[k]) + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="muted small">Three buckets, always reported separately. The source doc’s 429/503 model ' +
    'has no bucket for the failure mode that actually occurred here, which is why collapsing them into one ' +
    'error rate would misattribute a client problem to Bedrock.</div>';
  html += '</section>';

  html += '</div>';
  return html;
}

/** Load one of the built-in files. Deep-copied, because benchTab() hands `steps[]` and the
 *  totals object straight to render helpers and a future edit that mutated either would
 *  otherwise corrupt the constant for the rest of the session. */
function loadBenchSample(key) {
  var s = benchSampleByKey(key);
  if (!s) {
    state.benchSampleKey = '';
    state.bench = null;
    render();
    return;
  }
  state.benchSampleKey = key;
  state.bench = JSON.parse(JSON.stringify(s.data));
  state.benchSource = 'built-in · ' + s.label + (s.measured ? ' (measured)' : ' (illustrative)');
  state.benchError = null;
  render();
}

async function loadBenchFromUrl() {
  state.benchTried = true;
  state.benchError = null;
  try {
    var res = await fetch('results.json', { cache: 'no-store' });
    var text = await res.text();
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      /* Same branch as api.ts:24-31: without the excerpt, a CloudFront HTML shell is a mystery. */
      throw new Error('HTTP ' + res.status + ': ' + text.slice(0, 300));
    }
    if (!res.ok) throw new Error(parsed.error || ('HTTP ' + res.status));
    state.bench = parsed;
    state.benchSource = 'site root /results.json';
    /* A real file outranks a built-in, and clearing the key is what takes the illustrative
       banner down — it keys off the selection, not off the data. */
    state.benchSampleKey = '';
  } catch (e) {
    state.bench = null;
    state.benchSampleKey = '';
    state.benchError = String(e.message || e);
  }
  render();
}

function loadBenchFromFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      state.bench = JSON.parse(String(reader.result));
      state.benchSource = 'local file ' + file.name;
      state.benchSampleKey = '';
      state.benchError = null;
    } catch (e) {
      state.bench = null;
      state.benchSampleKey = '';
      state.benchError = file.name + ' is not JSON: ' + String(e.message || e);
    }
    render();
  };
  reader.readAsText(file);
}

/* ============================== TABS 3 & 4 — SCAN RESULTS and API INTEGRATION ======== */

/* One section, two tabs, because they read the same data and the same GET /runs response:
     SCAN RESULTS     the persisted run history — every scan, from the UI and from the API
     API INTEGRATION  how to call the thing yourself: endpoint, key, limits, curl and Python

   They were one tab and it did both jobs badly: the integration guide was a footnote above a
   table, and the table was buried under it. GET /runs serves both (it returns the runs, the
   endpoint, the key and today's usage), so the split is presentational and neither tab needs
   its own fetch.

   Every run is persisted whole: the complete email body, the full sender address, the
   subject and the attachment names, alongside verdict, timings and usage, under a 7-day
   DynamoDB TTL. That is a deliberate decision so these tabs can show exactly what
   was scanned — and it means consumer email content is at rest in this account while design
   §10 R5's data_retention question (the Gemma 4 catalog entry defaults to
   provider_data_share) is still open. Stated once, factually.

   Operational consequence for everything below: the stored body is attacker-controlled text
   that arrived at a public, key-authenticated endpoint. Every field rendered from a run goes
   through esc(). That is a security requirement here, not tidiness. */

var DAILY_CAP_DEFAULT = 5000;
/* API Gateway route-level throttling on POST /public/scan. Surfaced in the panel so someone
   hammering the endpoint from a loop reads the 429 as configuration, not breakage. */
var PUBLIC_THROTTLE = { rate: 10, burst: 20 };

/* Filled at render time and read by wire(); the copy button never reads the DOM for its
   payload. Same discipline as every input on this page — handlers read state, not nodes. */
var COPY_PAYLOADS = {};

/** Epoch ms from a stored ISO-8601 timestamp. The backend writes UTC; a string carrying no
 *  zone marker is treated as UTC rather than as browser-local, or every row in the table
 *  reads hours off for anyone outside UTC. */
function tsMs(iso) {
  if (!iso) return null;
  var s = String(iso);
  if (!/([zZ]|[+-]\d\d:?\d\d)$/.test(s)) s += 'Z';
  var t = Date.parse(s);
  return isFinite(t) ? t : null;
}

/** "3m ago". The absolute UTC stamp always travels with it on the title attribute, so no
 *  timestamp is ever *only* relative. */
function relTime(iso) {
  var t = tsMs(iso);
  if (t === null) return '—';
  var secs = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (secs < 10) return 'just now';
  if (secs < 60) return secs + 's ago';
  var mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 48) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function utcStamp(iso) {
  var t = tsMs(iso);
  if (t === null) return String(iso || '—');
  return new Date(t).toISOString().replace('T', ' ').replace(/\.\d+Z$/, '') + ' UTC';
}

/** Latency for a table cell, formatted exactly as the session strip does it: the number, or
 *  a literal n/a. bedrockLatencyMs is null on the whole mantle lane (results.md §4.3), and a
 *  0 there would read as infinitely fast. */
function latCell(v) {
  return v === null ? '<span class="muted">n/a</span>' : esc(fmt(v));
}

/** The registry labels carry their role clause ("… — the doc's model"), which is too long
 *  for a table column. Keep the head, put the whole thing on hover. */
function shortModel(run) {
  var full = run.modelLabel || (run.modelId ? modelById(run.modelId).label : '') || run.modelId || '—';
  return String(full).split(' — ')[0].trim();
}

/* Which route recorded the row, mirroring runs_store._SOURCES. Four values, not two, since the
   two scan buttons each get their own — a Simple Scan row and a pipeline row are different
   things and a table that called both "ui" would hide which. */
var SOURCE_HINT = {
  ui: 'The /scan pipeline from this SPA: Stage 1, the server-side gate, and Stage 2 when the gate fired.',
  'ui-simple': 'The Simple Scan button — POST ' + API_BASE + '/classify. One stage. The gate reason is ' +
    'recorded, but no Stage 2 ran, which is why `escalated` is false on these rows.',
  'ui-deep': 'The Deep Scan button — POST ' + API_BASE + '/deep-scan. Stage 2 alone, run on request with ' +
    'no Stage 1 context threaded in.',
  api: 'Submitted to POST ' + API_BASE + '/public/scan with an x-api-key header — no Cognito session involved.'
};

function sourceBadge(source) {
  var s = String(source || 'ui');
  var cls = 'src' + (s === 'api' ? ' src-api' : '');
  var hint = SOURCE_HINT[s] || 'Source recorded by the backend, passed through verbatim.';
  return '<span class="' + cls + '" title="' + esc(hint) + '">' + esc(s) + '</span>';
}

/** A key/value grid. Values are escaped here, so callers pass text and an optional class —
 *  never markup. Nothing rendered from a stored run can carry HTML through this. */
function kvGrid(rows) {
  var html = '<div class="kv">';
  rows.forEach(function (row) {
    html += '<div class="k">' + esc(row[0]) + '</div>' +
      '<div class="v ' + esc(row[2] || '') + '">' + esc(row[1] === null || row[1] === undefined || row[1] === '' ? '—' : row[1]) + '</div>';
  });
  return html + '</div>';
}

/* ------------------------------------------------------------------ run normalisation */

/** One stored item -> the shape this tab renders. Read leniently, exactly as normStage does,
 *  so a backend field rename degrades a cell rather than blanking the tab. */
function normRun(raw, i) {
  var r = (raw && typeof raw === 'object') ? raw : {};
  var t = r.timings || {};
  var u = r.usage || {};
  var em = r.email || {};
  var s2 = (r.stage2 && typeof r.stage2 === 'object') ? r.stage2 : null;
  return {
    key: r.runId ? 'r' + String(r.runId) : 'i' + i,
    runId: r.runId ? String(r.runId) : '—',
    ts: r.ts || '',
    tsMs: tsMs(r.ts),
    source: String(r.source || 'ui'),
    /* Which stages the row actually ran. Older rows predate the field, so an empty list means
       "not recorded" and the table falls back to inferring it from stage2 — never claims. */
    stages: Array.isArray(r.stages) ? r.stages.filter(function (s) { return !!s; }) : [],
    modelId: r.modelId || '',
    modelLabel: r.modelLabel || '',
    endpoint: r.endpoint || '',
    servedVia: pick(r, 'servedVia', 'served_via') || '',
    promptOverridden: !!pick(r, 'promptOverridden', 'prompt_overridden'),
    region: r.region || '',
    verdict: String(r.verdict === undefined || r.verdict === null ? '—' : r.verdict),
    confidence: num(r.confidence),
    signals: Array.isArray(r.signals) ? r.signals : [],
    parseError: r.parseError || r.parse_error || null,
    escalated: !!r.escalated,
    escalationReason: r.escalationReason || r.escalation_reason || null,
    stage2: s2 ? {
      recommendedAction: s2.recommendedAction || s2.recommended_action || null,
      riskScore: num(pick(s2, 'riskScore', 'risk_score')),
      disagreesWithStage1: pick(s2, 'disagreesWithStage1', 'disagrees_with_stage1') === true
    } : null,
    timings: {
      ttftMs: ms(pick(t, 'ttftMs', 'ttft_ms')),
      e2eMs: ms(pick(t, 'e2eMs', 'e2e_ms')),
      bedrockLatencyMs: ms(pick(t, 'bedrockLatencyMs', 'bedrock_latency_ms')),
      overheadMs: ms(pick(t, 'overheadMs', 'overhead_ms')),
      otps: num(pick(t, 'otps', 'output_tokens_per_second'))
    },
    usage: {
      inputTokens: num(pick(u, 'inputTokens', 'input_tokens')) || 0,
      outputTokens: num(pick(u, 'outputTokens', 'output_tokens')) || 0,
      totalTokens: num(pick(u, 'totalTokens', 'total_tokens')) || 0
    },
    email: {
      from: em.from === undefined || em.from === null ? '' : String(em.from),
      subject: em.subject === undefined || em.subject === null ? '' : String(em.subject),
      body: em.body === undefined || em.body === null ? '' : String(em.body),
      attachments: Array.isArray(em.attachments) ? em.attachments : []
    }
  };
}

/* ------------------------------------------------------- the integration snippets

   Three endpoints, TWO DIFFERENT CREDENTIALS, and conflating them is the mistake this panel
   exists to prevent:

     POST /api/public/scan   x-api-key         full pipeline: Stage 1 + gate + Stage 2 if it fires
     POST /api/classify      Cognito IdToken   Simple Scan — one stage, plus the gate decision
     POST /api/deep-scan     Cognito IdToken   Deep Scan — one stage, no prior context

   The two single-stage routes sit behind the API Gateway JWT authorizer on the $default route,
   so they take a Bearer IdToken and NOT the API key. There is no way to reach them with the key
   alone, and every snippet below says which credential it is using rather than leaving a reader
   to find out from a 401.

   All of them also need `x-origin-secret`, which CloudFront injects — so they must be called on
   the CloudFront hostname, never on the raw execute-api URL. A 403 from these means exactly
   that, and is a different failure from the 401 a bad credential returns. */

var SNIPPET_EMAIL_TEXT =
  'From: security-alert@paypa1-verify.example.net\\n' +
  'Subject: Urgent: your account will be suspended in 24 hours\\n\\n' +
  'We detected unusual sign-in activity on your account. Verify your identity within 24 ' +
  'hours or the account will be closed: http://bit.ly/x9v3rify';

function publicCurl(endpoint, key) {
  return 'curl -sS -X POST ' + endpoint + " \\\n" +
    "  -H 'content-type: application/json' \\\n" +
    "  -H 'x-api-key: " + key + "' \\\n" +
    '  -d \'{"text":"' + SNIPPET_EMAIL_TEXT + '"}\'';
}

/** curl for the structured body: every override in one request, attachments included. */
function overridesCurl(base, region, modelId) {
  return '# Every override in one request. All of these are optional; the only required field is\n' +
    '# the email itself, as either "email" (structured) or "text" (raw paste).\n' +
    'curl -sS -X POST ' + base + '/classify \\\n' +
    "  -H 'content-type: application/json' \\\n" +
    '  -H "authorization: Bearer $TOKEN" \\\n' +
    '  -d @- <<\'JSON\'\n' +
    '{\n' +
    '  "email": {\n' +
    '    "from": "billing@invoice-services.example.net",\n' +
    '    "subject": "Overdue invoice INV-99231 - final notice",\n' +
    '    "body": "Your account is overdue. Open the attached document and enable content.",\n' +
    '    "attachments": ["Invoice_INV-99231.zip", "payment_details.docm", "viewer_setup.pdf.exe"]\n' +
    '  },\n' +
    '  "region":      "' + region + '",\n' +
    '  "modelId":     "' + modelId + '",\n' +
    '  "maxTokens":   320,\n' +
    '  "temperature": 0,\n' +
    '  "serviceTier": "flex",\n' +
    '  "systemPrompt": "You are an email threat analyzer. Weigh attachment extensions above all\\nother signals. Rank signals strongest-evidence-first, at most 5.\\nRespond with JSON only."\n' +
    '}\n' +
    'JSON\n\n' +
    '# attachments are NAMES ONLY. Nothing binary is parsed or uploaded, and the filename is the\n' +
    '# signal: a double extension like viewer_setup.pdf.exe is the whole finding.\n' +
    '#\n' +
    '# systemPrompt replaces the instruction BODY only. The server re-appends the JSON shape (on a\n' +
    '# lane with no response_format) and then the injection guard, always last, so an override\n' +
    '# cannot delete the guard. Check promptSent.system in the response for the exact bytes.\n' +
    '#\n' +
    '# region must be one the chosen model answers in, or the reply is a 400 naming the supported\n' +
    '# regions -- never a silent fallback to a region you did not ask for.';
}

/** curl that posts a file directly, with no JSON wrapping. */
function fileCurl(base, region) {
  return '# Scan a .eml file straight off disk. content-type message/rfc822 (or text/plain) tells\n' +
    '# the handler to treat the whole body as the pasted email, so there is no JSON to build and\n' +
    '# nothing to escape -- which is what makes this safe for a real message full of quotes.\n' +
    'curl -sS -X POST "' + base + '/classify?region=' + region + '" \\\n' +
    "  -H 'content-type: message/rfc822' \\\n" +
    '  -H "authorization: Bearer $TOKEN" \\\n' +
    '  --data-binary @suspicious.eml\n\n' +
    '# With a raw body there is no room for the other options, so they move to the query string:\n' +
    '#   ?region=...&modelId=...&maxTokens=...&serviceTier=...\n' +
    '# Leading From:/To:/Subject: lines are split off the top; a header-looking line further down\n' +
    '# stays in the body, deliberately -- otherwise a sender could plant a Subject: three\n' +
    '# paragraphs in and rewrite the field the analyst reads.\n\n' +
    '# The JSON equivalent, if you would rather build the object (jq -Rs slurps the file as one\n' +
    '# JSON string, which is what makes this correct for multi-line content):\n' +
    'jq -Rs --arg region "' + region + '" \'{text: ., region: $region}\' suspicious.eml \\\n' +
    '  | curl -sS -X POST ' + base + '/classify \\\n' +
    "      -H 'content-type: application/json' \\\n" +
    '      -H "authorization: Bearer $TOKEN" --data-binary @-';
}

/** curl for one of the two single-stage routes. IdToken, not the API key. */
function stageCurl(base, path, region) {
  return '# Simple Scan is /classify, Deep Scan is /deep-scan. Both need a Cognito IdToken,\n' +
    '# NOT the x-api-key -- they sit behind the JWT authorizer on the $default route.\n' +
    'TOKEN=$(aws cognito-idp initiate-auth \\\n' +
    '  --auth-flow USER_PASSWORD_AUTH \\\n' +
    '  --client-id "$COGNITO_CLIENT_ID" \\\n' +
    '  --auth-parameters USERNAME=demo,PASSWORD="$DEMO_PASSWORD" \\\n' +
    '  --query AuthenticationResult.IdToken --output text)\n\n' +
    'curl -sS -X POST ' + base + path + " \\\n" +
    "  -H 'content-type: application/json' \\\n" +
    '  -H "authorization: Bearer $TOKEN" \\\n' +
    '  -d \'{\n' +
    '    "text": "' + SNIPPET_EMAIL_TEXT + '",\n' +
    '    "region": "' + region + '",\n' +
    '    "modelId": "' + state.modelId + '"\n' +
    '  }\'';
}

/** Python for the public route. requests only, no SDK, no signing — the key is the credential. */
function publicPython(endpoint) {
  return 'import os, requests\n\n' +
    '# The full pipeline: Stage 1, the server-side escalation gate, and Stage 2 only when the\n' +
    '# gate fires. One call, one key, no Cognito.\n' +
    'EMAIL = """From: security-alert@paypa1-verify.example.net\n' +
    'Subject: Urgent: your account will be suspended in 24 hours\n\n' +
    'We detected unusual sign-in activity on your account. Verify your identity within\n' +
    '24 hours or the account will be closed: http://bit.ly/x9v3rify"""\n\n' +
    'r = requests.post(\n' +
    '    "' + endpoint + '",\n' +
    '    headers={"x-api-key": os.environ["EMAIL_SCAN_API_KEY"]},\n' +
    '    json={"text": EMAIL, "region": "' + state.region + '"},\n' +
    '    timeout=35,   # API Gateway hard-caps at 30s; give it headroom, not less\n' +
    ')\n' +
    'r.raise_for_status()   # 401 = key; 403 = not called through CloudFront; 429 = capped\n' +
    'out = r.json()\n\n' +
    'print(out["verdict"], out["totalMs"], "ms")\n' +
    'print("escalated:", out["escalated"], out["escalationReason"])\n' +
    'print("stage 1 TTFT:", out["stage1"]["timings"]["ttftMs"], "ms")\n' +
    'if out["stage2"]:\n' +
    '    print("stage 2 action:", out["stage2"]["result"]["recommendedAction"])';
}

/** Python for the two single-stage routes, with the IdToken exchange included. */
function stagePython(base, region) {
  return 'import os, boto3, requests\n\n' +
    'BASE = "' + base + '"\n\n' +
    'EMAIL = """From: security-alert@paypa1-verify.example.net\n' +
    'Subject: Urgent: your account will be suspended in 24 hours\n\n' +
    'We detected unusual sign-in activity on your account. Verify your identity within\n' +
    '24 hours or the account will be closed: http://bit.ly/x9v3rify"""\n\n' +
    '# Simple Scan and Deep Scan are Cognito-authenticated, so start with an IdToken.\n' +
    '# The API key does NOT work on these two routes. The user pool is in us-east-1 by\n' +
    '# construction, which is independent of the region Bedrock is invoked in.\n' +
    'idp = boto3.client("cognito-idp", region_name="us-east-1")\n' +
    'token = idp.initiate_auth(\n' +
    '    AuthFlow="USER_PASSWORD_AUTH",\n' +
    '    ClientId=os.environ["COGNITO_CLIENT_ID"],\n' +
    '    AuthParameters={"USERNAME": "demo", "PASSWORD": os.environ["DEMO_PASSWORD"]},\n' +
    ')["AuthenticationResult"]["IdToken"]\n\n' +
    'HEADERS = {"authorization": f"Bearer {token}"}\n\n\n' +
    'def scan(path, email=None, text=None, region=None, model_id=None,\n' +
    '         system_prompt=None, max_tokens=None, service_tier=None):\n' +
    '    """One call. Every keyword below is optional except the email itself.\n\n' +
    '    email:  {"from", "subject", "body", "attachments"} -- the structured form\n' +
    '    text:   a raw pasted email; leading From:/To:/Subject: lines are split off\n' +
    '    Send one or the other. If both carry content, the structured form wins.\n' +
    '    """\n' +
    '    body = {}\n' +
    '    if email is not None:\n' +
    '        body["email"] = email\n' +
    '    if text is not None:\n' +
    '        body["text"] = text\n' +
    '    if region:\n' +
    '        # Any region the chosen model answers in. An unsupported (model, region) pair is a\n' +
    '        # 400 naming the supported regions -- never a silent fallback to another region.\n' +
    '        body["region"] = region\n' +
    '    if model_id:\n' +
    '        body["modelId"] = model_id\n' +
    '    if max_tokens:\n' +
    '        body["maxTokens"] = max_tokens        # capped server-side at 2000\n' +
    '    if service_tier:\n' +
    '        body["serviceTier"] = service_tier    # "flex" halves token cost; NOT faster\n' +
    '    if system_prompt:\n' +
    '        # Replaces the instruction BODY only. The server re-appends the JSON shape (on a\n' +
    '        # lane with no response_format) and then the injection guard, always last, so this\n' +
    '        # cannot delete the guard. Read promptSent.system back for the exact bytes sent.\n' +
    '        body["systemPrompt"] = system_prompt\n' +
    '    r = requests.post(BASE + path, headers=HEADERS, json=body, timeout=35)\n' +
    '    r.raise_for_status()   # 401 = token; 403 = not through CloudFront; 400 = bad pair\n' +
    '    return r.json()\n\n\n' +
    '# --- 1. Simple Scan, defaults throughout -----------------------------------------\n' +
    'simple = scan("/classify", text=EMAIL)\n' +
    'print(simple["result"]["verdict"], simple["result"]["confidence"])\n' +
    'print("TTFT", simple["timings"]["ttftMs"], "ms  E2E", simple["timings"]["e2eMs"], "ms")\n' +
    'print("served via", simple["servedVia"])          # always an Amazon Bedrock host\n' +
    'print("region used", simple["region"])            # ' + DEFAULT_REGION + ' unless overridden\n' +
    'print("gate would escalate:", simple["wouldEscalate"], simple["escalationReason"])\n\n' +
    '# --- 2. Deep Scan, only when the gate asks for it --------------------------------\n' +
    '# Standalone: it gets no Stage 1 context. That threading is server-side in /scan only,\n' +
    '# because a client-supplied prior classification would put the deep scan\'s premise in\n' +
    '# the caller\'s hands on a product whose input is adversarial.\n' +
    'if simple["wouldEscalate"]:\n' +
    '    deep = scan("/deep-scan", text=EMAIL)\n' +
    '    print(deep["result"]["recommendedAction"], deep["result"]["riskScore"])\n' +
    '    print("E2E", deep["timings"]["e2eMs"], "ms")\n\n' +
    '# --- 3. Structured body with ATTACHMENTS -----------------------------------------\n' +
    '# Attachment NAMES only. Nothing binary is parsed or uploaded, and the filename is the\n' +
    '# signal: the double extension on viewer_setup.pdf.exe is the whole finding.\n' +
    'withattach = scan("/classify", email={\n' +
    '    "from": "billing@invoice-services.example.net",\n' +
    '    "subject": "Overdue invoice INV-99231 - final notice",\n' +
    '    "body": "Your account is overdue. Open the attached document and enable content.",\n' +
    '    "attachments": ["Invoice_INV-99231.zip", "payment_details.docm",\n' +
    '                    "viewer_setup.pdf.exe"],\n' +
    '})\n' +
    'print(withattach["result"]["verdict"], withattach["escalationReason"])\n\n' +
    '# --- 4. Region override ----------------------------------------------------------\n' +
    '# The two lanes have DISJOINT EU regions, so the region is a property of the model:\n' +
    '#   ' + state.modelId + ' -> eu-central-1 (Frankfurt); eu-west-1 is a 404\n' +
    '#   the Converse lane          -> eu-west-1 (Ireland); it is not in Frankfurt at all\n' +
    '#   us-east-1                  -> the only region that runs both, so A/B needs it\n' +
    'eu = scan("/classify", text=EMAIL, region="eu-central-1")\n' +
    'us = scan("/classify", text=EMAIL, region="us-east-1")\n' +
    'print("Frankfurt", eu["timings"]["e2eMs"], "ms vs N.Virginia", us["timings"]["e2eMs"], "ms")\n\n' +
    '# --- 5. System prompt override ---------------------------------------------------\n' +
    'tuned = scan("/classify", text=EMAIL, system_prompt="""\\\n' +
    'You are an email threat analyzer, Stage 1 (fast triage).\n' +
    'Weigh attachment extensions and URL hosts above all other signals.\n' +
    'Rank signals strongest-evidence-first. Return at most 5.\n' +
    'Respond with JSON only. Be terse - no prose outside the JSON.""")\n' +
    'assert tuned["promptOverridden"] is True\n' +
    '# The guard is still there, and still last. Assert it rather than trusting it:\n' +
    'assert tuned["promptSent"]["system"].rstrip().endswith("raise the verdict accordingly.")\n\n' +
    '# --- 6. Scan a file straight off disk --------------------------------------------\n' +
    'with open("suspicious.eml", encoding="utf-8", errors="replace") as fh:\n' +
    '    from_file = scan("/classify", text=fh.read(), region="' + region + '")\n' +
    'print(from_file["result"]["verdict"])\n\n' +
    '# Or skip the JSON entirely -- content-type message/rfc822 means the body IS the email,\n' +
    '# which avoids escaping a real message full of quotes and newlines. Options move to the\n' +
    '# query string; systemPrompt is not accepted there, because query strings are logged.\n' +
    'with open("suspicious.eml", "rb") as fh:\n' +
    '    raw = requests.post(BASE + "/classify", params={"region": "' + region + '"},\n' +
    '                        headers={**HEADERS, "content-type": "message/rfc822"},\n' +
    '                        data=fh.read(), timeout=35)\n' +
    'raw.raise_for_status()\n' +
    'print(raw.json()["result"]["verdict"])';
}

/** One labelled, copyable snippet block. `slot` is the COPY_PAYLOADS key. */
function snippet(slot, title, note, text) {
  COPY_PAYLOADS[slot] = text;
  var html = '<div class="curl"><div class="row wrap" style="align-items:center">' +
    '<span class="muted small" style="flex:1"><strong>' + esc(title) + '</strong> — ' + note + '</span>' +
    '<button data-copy="' + esc(slot) + '">' +
    (state.runsCopied === slot ? 'copied ✓' : 'copy') + '</button></div>';
  html += '<pre>' + esc(text) + '</pre></div>';
  return html;
}

  html += kvGrid([

    ['raw body', 'content-type: message/rfc822 or text/plain — the body IS the email, no JSON to ' +

  /* The key is displayed on purpose: this tab sits behind the Cognito JWT authorizer, and

  html += '<h3>Full pipeline — curl</h3>';
  html += snippet('curl', 'POST /public/scan', 'real key filled in; paste into any terminal',

  html += '<h3>Simple Scan and Deep Scan — curl</h3>';

  /* --- abuse control, stated up front. A leaked key must not be able to run an unbounded
         bill overnight, and someone testing the endpoint must not read the guard rails as
         a broken service. --- */
  html += '<h3>Limits — read these before you loop on it</h3>';
  html += '<div class="bars" style="margin-bottom:8px">';
  if (used === null) {
    html += '<div class="muted small">Daily usage not returned by the API. The cap is ' +
      esc(cap.toLocaleString()) + ' requests/day.</div>';
  } else {
    var ratio = cap ? used / cap : 0;
    html += barRow('today', used, cap, ' req', ratio >= 0.9 ? 'fail' : 'pass', 0);
    html += '<div class="legend" style="margin-left:100px"><strong>' + esc(used.toLocaleString()) + ' / ' +
      esc(cap.toLocaleString()) + ' today</strong>' +
