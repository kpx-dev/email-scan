<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Scan — Bedrock PoC</title>
<style>
/* ------------------------------------------------------------------------------------
   Design tokens — two complete, contrast-checked sets.

   Light is the default on :root. Dark arrives either from the OS preference or from an
   explicit data-theme="dark" stamp on <html>. The scoping is deliberate:

     :root                                          -> light
     @media (prefers-color-scheme: dark) {
       :root:where(:not([data-theme="light"])) }     -> OS dark, unless a light stamp
     :root[data-theme="dark"]                        -> explicit dark

   :where() contributes no specificity, so the OS-dark block sits at the same weight as
   :root and wins only by source order — which is why an explicit data-theme="light"
   still beats an OS dark preference, and an explicit "dark" still beats an OS light one.
   The page also themes correctly with JavaScript disabled.

   TWO STATUS SETS, ON PURPOSE.
     --mark-good / --mark-warn / --mark-crit are *marks*: bar fills, meters, dots, chip
     backgrounds, the target rule. They are identical in both modes because a status hue
     must not change meaning between themes.
     --good / --warn / --crit are the *text* variants. #fab219 as text on white is
     1.83:1, so no coloured text ever uses a --mark-* token, and verdict chips are a
     tinted background plus the dark text colour rather than colour-on-white.
   --on-accent and --accent-ink are the two foreground inks for accent surfaces (filled
   button, and text on an accent tint). They exist because white-on-#3987e5 is only
   3.6:1 in dark mode; they do not replace --accent, which stays exactly as specified.
   ------------------------------------------------------------------------------------ */
:root {
  color-scheme: light;

  --bg: #f7f7f5;
  --panel: #ffffff;
  --panel-2: #f4f4f1;
  --line: #e1e0d9;
  --zebra: #fbfbf9;
  --th-bg: #f1f1ed;

  --text: #0b0b0b;            /* 19.7:1 */
  --text-2: #52514e;          /*  7.9:1 */
  --muted: #6b6a65;           /*  5.4:1 */
  --accent: #226ecb;          /*  5.1:1 */
  --accent-2: #1a5aa8;
  --on-accent: #ffffff;       /* on the --accent fill: 5.1:1 */
  --accent-ink: #1a5aa8;      /* accent text on an accent tint */
  --focus: #1a5fb4;

  /* marks — never used as text */
  --mark-good: #0ca30c;
  --mark-warn: #fab219;
  --mark-crit: #d03b3b;

  /* coloured text */
  --good: #006300;
  --warn: #8a5a00;
  --crit: #b02525;

  /* legacy aliases kept so existing markup keeps working; both are TEXT inks */
  --pass: #006300;
  --fail: #b02525;
  --benign: #006300;
  --susp: #8a5a00;
  --mal: #b02525;

  /* verdict chips: tinted plane + dark ink */
  --chip-benign-bg: #e6f4e6;  --chip-benign-fg: #006300;   /* 6.6:1 */
  --chip-susp-bg: #fdf0d5;    --chip-susp-fg: #8a5a00;     /* 5.3:1 */
  --chip-mal-bg: #fbe6e6;     --chip-mal-fg: #b02525;      /* 5.6:1 */

  /* tints and hairlines for banners, badges and row highlights */
  --accent-tint: rgba(34, 110, 203, .08);
  --accent-edge: rgba(34, 110, 203, .38);
  --good-tint: rgba(12, 163, 12, .09);
  --good-edge: rgba(12, 163, 12, .38);
  --warn-tint: rgba(250, 178, 25, .16);
  --warn-edge: rgba(250, 178, 25, .55);
  --crit-tint: rgba(208, 59, 59, .09);
  --crit-edge: rgba(208, 59, 59, .38);
  --good-wash: rgba(12, 163, 12, .05);
  --crit-wash: rgba(208, 59, 59, .05);
  --hover: rgba(34, 110, 203, .07);

  --shadow: 0 1px 1px rgba(20, 20, 18, .04), 0 8px 20px -12px rgba(20, 20, 18, .18);
}

/* OS dark, unless the user has explicitly stamped light */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;

    --bg: #0d0d0d;
    --panel: #1a1a19;
    --panel-2: #232321;
    --line: #2c2c2a;
    --zebra: #1f1f1e;
    --th-bg: #202020;

    --text: #ffffff;          /* 17.4:1 */
    --text-2: #c3c2b7;        /*  9.7:1 */
    --muted: #9a9992;         /*  6.1:1 */
    --accent: #3987e5;        /*  4.8:1 */
    --accent-2: #63a2ee;
    --on-accent: #06121f;     /* on the --accent fill: 5.2:1 */
    --accent-ink: #7fb3f0;    /* accent text on an accent tint: 6.7:1 */
    --focus: #6ea8f0;

    --mark-good: #0ca30c;
    --mark-warn: #fab219;
    --mark-crit: #d03b3b;

    --good: #3ecf8e;
    --warn: #fab219;
    --crit: #e66767;

    --pass: #3ecf8e;
    --fail: #e66767;
    --benign: #3ecf8e;
    --susp: #fab219;
    --mal: #e66767;

    --chip-benign-bg: #15291d; --chip-benign-fg: #3ecf8e;   /* 7.7:1 */
    --chip-susp-bg: #2b2210;   --chip-susp-fg: #fab219;     /* 8.6:1 */
    --chip-mal-bg: #2e1a1a;    --chip-mal-fg: #e66767;      /* 5.1:1 */

    --accent-tint: rgba(57, 135, 229, .14);
    --accent-edge: rgba(57, 135, 229, .48);
    --good-tint: rgba(62, 207, 142, .10);
    --good-edge: rgba(62, 207, 142, .34);
    --warn-tint: rgba(250, 178, 25, .12);
    --warn-edge: rgba(250, 178, 25, .42);
    --crit-tint: rgba(230, 103, 103, .12);
    --crit-edge: rgba(230, 103, 103, .45);
    --good-wash: rgba(62, 207, 142, .06);
    --crit-wash: rgba(230, 103, 103, .06);
    --hover: rgba(57, 135, 229, .10);

    --shadow: 0 1px 2px rgba(0, 0, 0, .34);
  }
}

/* explicit dark — must beat an OS light preference, so it is stamped and later.
   Keep this list byte-identical to the block above apart from the selector. */
:root[data-theme="dark"] {
  color-scheme: dark;

  --bg: #0d0d0d;
  --panel: #1a1a19;
  --panel-2: #232321;
  --line: #2c2c2a;
  --zebra: #1f1f1e;
  --th-bg: #202020;

  --text: #ffffff;
  --text-2: #c3c2b7;
  --muted: #9a9992;
  --accent: #3987e5;
  --accent-2: #63a2ee;
  --on-accent: #06121f;
  --accent-ink: #7fb3f0;
  --focus: #6ea8f0;

  --mark-good: #0ca30c;
  --mark-warn: #fab219;
  --mark-crit: #d03b3b;

  --good: #3ecf8e;
  --warn: #fab219;
  --crit: #e66767;

  --pass: #3ecf8e;
  --fail: #e66767;
  --benign: #3ecf8e;
  --susp: #fab219;
  --mal: #e66767;

  --chip-benign-bg: #15291d; --chip-benign-fg: #3ecf8e;
  --chip-susp-bg: #2b2210;   --chip-susp-fg: #fab219;
  --chip-mal-bg: #2e1a1a;    --chip-mal-fg: #e66767;

  --accent-tint: rgba(57, 135, 229, .14);
  --accent-edge: rgba(57, 135, 229, .48);
  --good-tint: rgba(62, 207, 142, .10);
  --good-edge: rgba(62, 207, 142, .34);
  --warn-tint: rgba(250, 178, 25, .12);
  --warn-edge: rgba(250, 178, 25, .42);
  --crit-tint: rgba(230, 103, 103, .12);
  --crit-edge: rgba(230, 103, 103, .45);
  --good-wash: rgba(62, 207, 142, .06);
  --crit-wash: rgba(230, 103, 103, .06);
  --hover: rgba(57, 135, 229, .10);

  --shadow: 0 1px 2px rgba(0, 0, 0, .34);
}

/* ---------------------------------------------------------------------------- base */

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app { padding: 24px 24px 64px; max-width: 1800px; margin: 0 auto; }

header { margin-bottom: 16px; }
h1 { font-size: 21px; margin: 0 0 4px; font-weight: 650; letter-spacing: -.01em; }
h2 {
  font-size: 12px; margin: 0 0 16px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-2); font-weight: 700;
}
h3 { font-size: 13px; margin: 20px 0 8px; font-weight: 650; color: var(--text); }
.sub { color: var(--text-2); font-size: 12.5px; }

.grid {
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(320px, 1fr) minmax(420px, 1.4fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 1200px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow);
}

label { display: block; font-size: 11px; color: var(--text-2); margin: 16px 0 4px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
label.check { display: flex; align-items: flex-start; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400; color: var(--text); margin-top: 16px; }
label.check input { width: auto; margin: 2px 0 0; flex: none; }
label.check > span { min-width: 0; }

input, select, textarea {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 11px;
  font: inherit;
}
textarea { resize: vertical; line-height: 1.5; }
textarea.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
::placeholder { color: var(--muted); opacity: 1; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
input[type="range"] { background: none; border: none; padding: 0; height: 26px; accent-color: var(--accent); }
input[type="file"] { padding: 6px 8px; font-size: 12px; }

/* One focus ring, both modes, >=3:1 against every surface it lands on. */
:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
/* the expandable runs rows are focusable, and an offset outline would be clipped there */
tr[data-run]:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

button {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 14px;
  font: inherit;
  font-weight: 550;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-tint); }
button:active:not(:disabled) { border-color: var(--accent); transform: translateY(1px); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
button.link { background: none; border: none; color: var(--accent); padding: 4px 0; text-decoration: underline; text-underline-offset: 2px; width: auto; font-weight: 500; }
button.link:hover:not(:disabled) { background: none; color: var(--accent-2); }

/* light/dark switch — a real button, so Enter and Space come for free */
.theme-toggle {
  display: inline-flex; align-items: center; gap: 6px; width: auto;
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text-2);
}
.theme-toggle:hover:not(:disabled) { color: var(--text); background: var(--accent-tint); border-color: var(--accent-edge); }
.theme-toggle .glyph { font-size: 13px; line-height: 1; }

.row { display: flex; gap: 8px; align-items: flex-end; }
.row > * { flex: 1; }
.row button { flex: 0 0 auto; }
.row.wrap { flex-wrap: wrap; }
.actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.gen { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }

.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tab { flex: 1; font-size: 12.5px; padding: 8px 10px; font-weight: 600; }
.tab.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab.active:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); color: var(--on-accent); }

.muted { color: var(--muted); }
.small { font-size: 12px; }
.muted.small { margin-top: 6px; line-height: 1.5; }

/* --- latency strip --- */
.latency { margin: 16px 0; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
.metric {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.metric.pass { border-color: var(--good-edge); }
.metric.fail { border-color: var(--crit-edge); }
.metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.metric-value { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.metric-unit { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }
.metric-flag { font-size: 10px; margin-top: 4px; font-weight: 600; }
.metric.pass .metric-flag { color: var(--good); }
.metric.fail .metric-flag { color: var(--crit); }

.tokens { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tokens strong { color: var(--text); }
.cache-hit { color: var(--good); }
.cache-write { color: var(--accent); }
.cold { color: var(--warn); }

/* --- results --- */
.result { border-top: 1px solid var(--line); padding-top: 16px; }
.result-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.verdict {
  font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  padding: 4px 10px; border-radius: 6px; background: var(--panel-2);
  border: 1px solid var(--line); color: var(--text);
}
.verdict-sm { font-size: 11px; font-weight: 650; padding: 2px 7px; }
/* Verdict chips are a tinted plane plus dark ink — never a status hue as bare text. */
.v-benign { background: var(--chip-benign-bg); color: var(--chip-benign-fg); border-color: transparent; }
.v-suspicious { background: var(--chip-susp-bg); color: var(--chip-susp-fg); border-color: transparent; }
.v-malicious { background: var(--chip-mal-bg); color: var(--chip-mal-fg); border-color: transparent; }
.chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text-2); }
.chip.risk, .chip.action { color: var(--text); font-weight: 600; }

.reason { font-size: 13.5px; line-height: 1.6; margin: 12px 0; color: var(--text); }
.reason .k { color: var(--muted); }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.tagrow .k, .disclosure .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tag { font-size: 11.5px; padding: 3px 9px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text-2); }

/* --- tables. Hairlines recessive, headers clearly not body rows, digits aligned. --- */
table.mini {
  width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px;
  font-variant-numeric: tabular-nums;
}
table.mini th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-2); padding: 8px 10px; background: var(--th-bg);
  border-bottom: 1px solid var(--line); font-weight: 700; white-space: nowrap;
}
table.mini th:first-child { border-top-left-radius: 8px; }
table.mini th:last-child { border-top-right-radius: 8px; }
table.mini td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
table.mini tbody tr:last-child > td { border-bottom: none; }
table.mini .num { text-align: right; font-variant-numeric: tabular-nums; }
/* zebra first, then every rule that must beat it */
table.mini tbody tr:nth-child(2n) > td { background: var(--zebra); }
table.mini.runs tbody tr:nth-child(2n) > td { background: transparent; }
table.mini tbody tr.hi > td { background: var(--accent-tint); }
.break { word-break: break-all; }
.truncate { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.history { font-size: 12px; }

.toggles { display: flex; gap: 16px; margin-top: 12px; }
.disclosure { margin-top: 8px; }
.disclosure pre {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  margin: 4px 0 12px;
  max-height: 320px;
  color: var(--text);
}

.warn {
  background: var(--warn-tint);
  border: 1px solid var(--warn-edge);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 12px 0;
  font-size: 12.5px;
  line-height: 1.55;
}
.warn code { background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }

.stats {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 12px;
  color: var(--text-2); margin-bottom: 8px; font-variant-numeric: tabular-nums;
}
.stats strong { color: var(--text); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------------------------
   Login gate, top bar, the results column, the token replay and the benchmark bars.
   Same tokens, same density.
   ------------------------------------------------------------------------------------ */

/* --- login gate --- */
.login-wrap { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 400px; padding: 24px; }
.login-card h1 { margin-bottom: 20px; }
.login-card .actions { margin-top: 24px; }
.login-card .actions button { flex: 1; }
.login-top { position: absolute; top: 20px; right: 24px; }

/* --- top bar --- */
.topbar { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.topbar .who { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-2); }
.tabs.main { max-width: 700px; margin-bottom: 20px; }

/* --- danger banner: the client-transport case, which must never read as amber --- */
.danger {
  background: var(--crit-tint);
  border: 1px solid var(--crit-edge);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 12px 0;
  font-size: 12.5px;
  line-height: 1.55;
}
.danger strong { color: var(--crit); }
.ok {
  background: var(--good-tint);
  border: 1px solid var(--good-edge);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 12px 0;
  font-size: 12.5px;
  line-height: 1.55;
}
.ok strong { color: var(--good); }

/* --- a metric tile with no number on this lane: never a 0, never a bare dash --- */
.metric-value.na { font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.5; margin-top: 3px; }

/* --- greyed, unsupported toggles (design 5.3, 5.4) --- */
.toggle-off { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 16px; cursor: not-allowed; }
.toggle-off input { width: auto; margin: 0; }
.toggle-off .na {
  font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  color: var(--warn); background: var(--warn-tint); border: 1px solid var(--warn-edge);
  border-radius: 5px; padding: 1px 6px;
}

/* --- the pipeline column --- */
.stage-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--panel-2); margin-bottom: 4px; }
.stage-card > h3 { margin-top: 0; }
.stage-card .result { border-top: none; padding-top: 4px; }
.stage-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stage-title .n { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; font-weight: 700; }
.arrow {
  margin: 12px 0; padding: 12px 14px; border-left: 3px solid var(--accent);
  background: var(--accent-tint); border-radius: 0 10px 10px 0; font-size: 12.5px;
}
.arrow.quiet { border-left-color: var(--line); background: none; color: var(--text-2); }
.arrow .why { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.arrow code { background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.skipped { border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }

/* --- token replay --- */
.replay { margin: 12px 0 4px; }
.replay-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.badge {
  font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  padding: 3px 8px; border-radius: 5px;
  background: var(--accent-tint); border: 1px solid var(--accent-edge); color: var(--accent-ink);
}
.replay pre {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; margin: 0; min-height: 72px; max-height: 220px; overflow: auto;
  white-space: pre-wrap; word-break: break-word; color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5;
}

/* --- bar charts (no chart library, no CDN).

/* ------------------------------------------------------------------------ small helpers */

function esc(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/** A finite number, or null. Guards against a JSON null, a string, or a NaN reaching a tile. */
function num(v) {
  var x = typeof v === 'string' ? Number(v) : v;
  return typeof x === 'number' && isFinite(x) ? x : null;
}

function ms(v) {
  var x = num(v);
  return x === null ? null : Math.round(x);
}

function fmt(v) {
  var x = num(v);
  return x === null ? '—' : x.toLocaleString();
}

/** Nearest-rank percentile with ceil, matching RunHistory.tsx and bench/driver.py.
 *  int(round(...)) and ceil disagree at small n — exactly the regime this UI runs in —
 *  so both sides of the repo use ceil (tasks.md T2.1). */
function pct(values, p) {
  if (!values.length) return null;
  var sorted = values.slice().sort(function (a, b) { return a - b; });
  var idx = Math.min(sorted.length - 1, Math.ceil((p / 100) * sorted.length) - 1);
  return Math.round(sorted[Math.max(0, idx)]);
}

/** First present key out of several aliases — results.json may be snake_case or camelCase. */
function pick(obj) {
  if (!obj) return undefined;
  for (var i = 1; i < arguments.length; i++) {
    var k = arguments[i];
    if (obj[k] !== undefined && obj[k] !== null) return obj[k];
  }
  return undefined;
}

function modelById(id) {
  for (var i = 0; i < state.models.length; i++) if (state.models[i].id === id) return state.models[i];
  return state.models[0];
}

function reasonFor(model, key) {
  return (model && model.unsupportedReason && model.unsupportedReason[key]) || '';
}

/* --------------------------------------------------------------------------- auth */

/** Read `exp` out of the IdToken so an expired session shows the login screen instead of
 *  a wall of 401s. base64url, so the padding has to be put back. */
function jwtExpired(token) {
  try {
    var part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (part.length % 4) part += '=';
    var exp = JSON.parse(atob(part)).exp;
    return typeof exp === 'number' ? exp * 1000 <= Date.now() : false;
  } catch (e) {
    return false;   // unparseable: let the API be the judge rather than locking the demo out
  }
}

function loadSession() {
  var token = sessionStorage.getItem(TOKEN_KEY);
  if (token && jwtExpired(token)) {
    clearSession();
    return null;
  }
  return token;
}

function clearSession() {
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(USER_KEY);
  state.token = null;
  state.user = null;
}

/** Cognito InitiateAuth USER_PASSWORD_AUTH, posted straight at the IDP endpoint. No SDK,
 *  no Amplify, no hosted UI — this is the whole auth client. */
async function signIn(username, password) {
  if (!COGNITO_CLIENT_ID) {
    throw new Error('COGNITO_CLIENT_ID is empty — deploy.sh injects it on the closing head tag. ' +
      'Serving frontend/index.html directly instead of the deployed index_deploy.html does this.');
  }
  var res = await fetch(COGNITO_IDP_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-amz-json-1.1',
      'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
    },
    body: JSON.stringify({
      AuthFlow: 'USER_PASSWORD_AUTH',
      ClientId: COGNITO_CLIENT_ID,
      AuthParameters: { USERNAME: username, PASSWORD: password }
    })
  });
  var text = await res.text();
  var parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error('Cognito HTTP ' + res.status + ': ' + text.slice(0, 300));
  }
  if (!res.ok) {
    throw new Error((parsed.message || parsed.__type || ('HTTP ' + res.status)));
  }
  if (parsed.ChallengeName) {
    throw new Error('Cognito returned challenge ' + parsed.ChallengeName +
      ' — the demo user needs a permanent password (admin-set-user-password --permanent).');
  }
  var id = parsed.AuthenticationResult && parsed.AuthenticationResult.IdToken;
  if (!id) throw new Error('no IdToken in the InitiateAuth response');
  sessionStorage.setItem(TOKEN_KEY, id);
  sessionStorage.setItem(USER_KEY, username);
  state.token = id;
  state.user = username;
}

/* ---------------------------------------------------------------------------- api */

/** The one HTTP entry point. The non-JSON branch is ported from api.ts:24-31 and pays for
 *  itself the first time CloudFront answers with the HTML shell instead of JSON: without
 *  the text excerpt the failure is an unexplained "Unexpected token <". */
async function call(path, body) {
  var headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

  var res = await fetch(API_BASE + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: headers,
    body: body === undefined ? undefined : JSON.stringify(body)
  });

  var text = await res.text();
  var parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error('HTTP ' + res.status + ': ' + text.slice(0, 300));
  }
  if (res.status === 401 || res.status === 403) {
    var authErr = new Error(parsed.message || parsed.error || ('HTTP ' + res.status));
    authErr.authFailed = res.status === 401;
    throw authErr;
  }
  if (!res.ok) {
    var err = new Error(parsed.error || parsed.message || ('HTTP ' + res.status));
    if (parsed.errorClass) err.errorClass = parsed.errorClass;
    throw err;
  }
  return parsed;
}

/* ---------------------------------------------------- response normalisation

   The handler owns the wire format; the UI reads it leniently so a field rename cannot
   blank the demo. Both lane clients return the same dict contract, which is exactly why
   this normaliser needs no lane awareness. */

function normStage(raw, stageName) {
  if (!raw || typeof raw !== 'object') return null;
  var t = raw.timings || {};
  var u = raw.usage || {};
  return {
    stage: raw.stage || stageName,
    result: raw.result && typeof raw.result === 'object' ? raw.result
      : (raw.verdict !== undefined ? raw : null),
    parseError: raw.parseError || raw.parse_error || null,
    raw: typeof raw.raw === 'string' ? raw.raw : '',
    stopReason: raw.stopReason || raw.stop_reason || null,
    modelId: raw.modelId || raw.model_id || state.modelId,
    modelLabel: raw.modelLabel || raw.model_label || modelById(raw.modelId || state.modelId).label,
    region: raw.region || state.region,
    endpoint: raw.endpoint || modelById(raw.modelId || state.modelId).endpoint,
    /* The server's own statement of which Bedrock host it called, for the region it actually
       used. Falls back to composing it from the mirror only when the field is absent. */
    servedVia: pick(raw, 'servedVia', 'served_via') ||
      servedVia(modelById(raw.modelId || state.modelId), raw.region || state.region),
    serviceTier: raw.serviceTier || raw.service_tier || null,
    promptOverridden: !!pick(raw, 'promptOverridden', 'prompt_overridden'),
    /* Present on /classify only: what the server's own design 4.4 gate decided about this
       Stage 1 output, without a Stage 2 having run. Never computed here — see _single_stage. */
    wouldEscalate: pick(raw, 'wouldEscalate', 'would_escalate'),
    escalationReason: pick(raw, 'escalationReason', 'escalation_reason') || null,
    promptSent: raw.promptSent || raw.prompt_sent || { system: '', user: '' },
    usage: {
      inputTokens: num(pick(u, 'inputTokens', 'input_tokens')) || 0,
      outputTokens: num(pick(u, 'outputTokens', 'output_tokens')) || 0,
      totalTokens: num(pick(u, 'totalTokens', 'total_tokens')) || 0,
      cacheReadInputTokens: num(pick(u, 'cacheReadInputTokens', 'cache_read_input_tokens')) || 0,
      cacheWriteInputTokens: num(pick(u, 'cacheWriteInputTokens', 'cache_write_input_tokens')) || 0
    },
    timings: {
      ttftMs: ms(pick(t, 'ttftMs', 'ttft_ms')),
      e2eMs: ms(pick(t, 'e2eMs', 'e2e_ms')),
      bedrockLatencyMs: ms(pick(t, 'bedrockLatencyMs', 'bedrock_latency_ms')),
      overheadMs: ms(pick(t, 'overheadMs', 'overhead_ms')),
      otps: num(pick(t, 'otps', 'output_tokens_per_second')),
      coldStart: !!(t.coldStart || t.cold_start || raw.coldStart)
    },
    timeline: Array.isArray(raw.timeline) ? raw.timeline : []
  };
}

/** POST /classify and POST /deep-scan both return one stage payload at the top level, so this
 *  is normStage plus the two things only a single-stage response carries. Kept separate from
 *  normStage so nothing has to guess whether `wouldEscalate: false` means "the gate said no" or
 *  "this response never had a gate". */
function normSingle(body, stageName) {
  var st = normStage(body, stageName);
  if (!st) return null;
  st.at = new Date();
  return st;
}

  configWarning: null,

     or the verbatim exception that stopped it. An AccessDeniedException here means the Lambda role
     is missing bedrock:ListFoundationModels. */

  modelId: MODELS[0].id,
  region: DEFAULT_REGION,
  flex: false,

  email: JSON.parse(JSON.stringify(SAMPLES[0].email)),

     style, so a refused file reads as refused rather than as a neutral note. */

  uploadError: false,

     from DEFAULT_PROMPT_BODIES and re-seeded from GET /models when that answers (but only for
     a stage the user has not edited — see loadConfig). `promptStage` is which of the two the
     editor is showing. The guard and the JSON shape are never in here: the server owns them
     and appends them to whatever body is sent. --- */
  promptStage: 'classify',
  promptBodies: {
    classify: DEFAULT_PROMPT_BODIES.classify,
    'deep-scan': DEFAULT_PROMPT_BODIES['deep-scan']
  },
  /* Per stage, true once the textarea differs from the default. Drives the "edited" badge and
     stops a late /models response from overwriting what someone is typing. */

     latencies can be compared side by side. --- */
  simple: null,
  deep: null,
  busySimple: false,
  busyDeep: false,
  errorSimple: null,
  errorDeep: null,
  errorClassSimple: null,
  errorClassDeep: null,

  runs: [],

  bench: null,
  benchError: null,
  benchSource: null,
  benchTried: false,
  /* '' when the charted file came from /results.json or from disk. Non-empty means a built-in
     is selected, which is also what drives the illustrative-data banner. */
  benchSampleKey: '',

  /* --- Scan Results tab. `state.runs` above is the *session* strip on the Scan tab: this
     browser tab's own scans, held in memory and lost on reload. These are the server-persisted
     runs from every source, UI and public API alike, read back from DynamoDB. Two different
     things that both call themselves runs, so they get different names. --- */
  runsAll: [],
  runsMeta: null,
  runsBusy: false,
  runsError: null,
  runsTried: false,
  runsOpen: {},
  runsCopied: null,
  runsCopyError: null,

  /* 'light' | 'dark'. themeExplicit is true once the user has actually pressed the
     toggle, which is what makes their choice outrank the OS preference. */
  theme: 'light',
  themeExplicit: false
};

/* ------------------------------------------------------------------------------ theme */

/* Rules of engagement here mirror every other control on this page (results.md §4.5):
   the handler reads and writes `state`, never the DOM, and it applies the theme by
   stamping <html> directly. So the toggle works whether or not render() runs afterwards,
   and a re-render — which rebuilds the button from state via innerHTML — cannot lose it. */

function osTheme() {
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function storedTheme() {
  try {
    var v = localStorage.getItem(THEME_KEY);
    return (v === 'light' || v === 'dark') ? v : null;
  } catch (e) {
    return null;    /* private mode / storage disabled: fall back to the OS preference */
  }
}

/** The single point that touches the document. data-theme="light" also has to be stamped
 *  explicitly, or an OS-dark preference would win over a user who chose light. */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
}

function initTheme() {
  var stored = storedTheme();
  state.themeExplicit = stored !== null;
  state.theme = stored || osTheme();
  applyTheme(state.theme);

  /* With no explicit choice, keep following the OS if it changes while the page is open. */
  var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () {
      if (state.themeExplicit) return;
      state.theme = osTheme();
      applyTheme(state.theme);
      paintThemeToggles();
    });
  }
}

function setTheme(t) {
  state.theme = (t === 'dark') ? 'dark' : 'light';
  state.themeExplicit = true;
  try {
    localStorage.setItem(THEME_KEY, state.theme);
  } catch (e) { /* a refused write must not break the toggle for this page view */ }
  applyTheme(state.theme);
  paintThemeToggles();
}

function toggleTheme() {
  setTheme(state.theme === 'dark' ? 'light' : 'dark');
}

function themeToggleHtml() {
  var dark = state.theme === 'dark';
  return '<button type="button" class="theme-toggle" data-theme-toggle' +
    ' aria-pressed="' + (dark ? 'true' : 'false') + '"' +
    ' aria-label="Dark mode" title="Switch to ' + (dark ? 'light' : 'dark') + ' mode">' +
    '<span class="glyph" aria-hidden="true">' + (dark ? '☾' : '☀') + '</span>' +
    '<span>' + (dark ? 'Dark' : 'Light') + '</span></button>';
}

/** Update the toggles in place. render() would produce the same markup from state, but the
 *  toggle must not depend on a re-render happening at all. */
function paintThemeToggles() {
  var dark = state.theme === 'dark';
  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) {
    b.setAttribute('aria-pressed', dark ? 'true' : 'false');
    b.setAttribute('title', 'Switch to ' + (dark ? 'light' : 'dark') + ' mode');
    b.innerHTML = '<span class="glyph" aria-hidden="true">' + (dark ? '☾' : '☀') + '</span>' +
      '<span>' + (dark ? 'Dark' : 'Light') + '</span>';
  });
}

/* ------------------------------------------------------------------ LatencyStrip port */

/** One metric tile. `na` is the text shown when the value is absent: on the mantle lane
 *  two of these tiles genuinely have no number, and a 0 there would read as
 *  "infinitely fast" while a bare dash reads as fast-but-unlabelled. */
function metricTile(o) {
  var v = num(o.value);
  var cls = 'metric' + (o.verdict ? ' ' + o.verdict : '');
  var body;
  if (v === null) {
    body = '<div class="metric-value na">' + esc(o.na || '—') + '</div>';
  } else {
    body = '<div class="metric-value">' + esc(v.toLocaleString()) +
      '<span class="metric-unit">' + esc(o.unit === undefined ? 'ms' : o.unit) + '</span></div>';
  }
  return '<div class="' + cls + '" title="' + esc(o.hint || '') + '">' +
    '<div class="metric-label">' + esc(o.label) + '</div>' +
    body +
    (o.verdict ? '<div class="metric-flag">' + (o.verdict === 'pass' ? '✓ target' : '✗ target') + '</div>' : '') +
    '</div>';
}

/* Hover hints ported verbatim from LatencyStrip.tsx. They are the artifact that makes the
   numbers defensible in the room; rewriting them produces worse copy. */
var HINT_BEDROCK = 'Bedrock’s own server-side metrics.latencyMs — the model time, excluding network.';
var HINT_OVERHEAD = 'E2E minus Bedrock’s own latency: network, TLS, SDK, Lambda. If this is large, the model isn’t the problem.';
var HINT_OTPS = 'Output tokens per second during generation';
var HINT_NO_SERVER_LATENCY =
  ' Not available on the Gemma 4 mantle lane: the OpenAI-shape response carries no equivalent of ' +
  'Converse’s metadata.metrics.latencyMs, so there is no server-reported number to show. ' +
  'A 0 here would read as infinitely fast, so the tile says so instead.';

function latencyStrip(st) {
  var t = st.timings, u = st.usage;
  var e2eTarget = st.stage === 'classify' ? TARGETS.classifyP50Ms : TARGETS.deepScanP95Ms;
  var cacheHit = u.cacheReadInputTokens > 0;
  var model = modelById(st.modelId);
  var cachingActive = !!model.supportsPromptCaching;
  var hasServerLatency = t.bedrockLatencyMs !== null;

  var html = '<div class="latency"><div class="metrics">';

  html += metricTile({
    label: 'TTFT',
    value: t.ttftMs,
    verdict: t.ttftMs === null ? undefined : (t.ttftMs <= TARGETS.ttftMs ? 'pass' : 'fail'),
    hint: 'Target < ' + TARGETS.ttftMs + 'ms. Measured at the Lambda, so it excludes your browser’s round trip to the API.'
  });
  html += metricTile({
    label: 'E2E',
    value: t.e2eMs,
    verdict: t.e2eMs === null ? undefined : (t.e2eMs <= e2eTarget ? 'pass' : 'fail'),
    hint: 'Target < ' + e2eTarget + 'ms for ' + (st.stage === 'classify' ? 'Stage 1 (P50)' : 'Stage 2 (P95)')
  });
  html += metricTile({
    label: 'Bedrock',
    value: t.bedrockLatencyMs,
    na: 'n/a on this lane',
    hint: HINT_BEDROCK + (hasServerLatency ? '' : HINT_NO_SERVER_LATENCY)
  });
  html += metricTile({
    label: 'Overhead',
    value: t.overheadMs,
    na: 'n/a on this lane',
    hint: HINT_OVERHEAD + (hasServerLatency ? '' : HINT_NO_SERVER_LATENCY)
  });
  html += metricTile({
    label: 'Output rate',
    value: t.otps === null ? null : Math.round(t.otps * 10) / 10,
    unit: ' tok/s',
    hint: HINT_OTPS
  });

  html += '</div><div class="tokens">';
  html += '<span><strong>' + esc(u.inputTokens.toLocaleString()) + '</strong> in</span>';
  html += '<span><strong>' + esc(u.outputTokens.toLocaleString()) + '</strong> out</span>';
  if (cacheHit) {
    html += '<span class="cache-hit" title="Cached prompt prefix was reused — this is the prompt-caching win">' +
      '⚡ ' + esc(u.cacheReadInputTokens.toLocaleString()) + ' cached</span>';
  }
  if (u.cacheWriteInputTokens > 0) {
    html += '<span class="cache-write" title="Cache was written on this request; the next identical request should read from it">' +
      esc(u.cacheWriteInputTokens.toLocaleString()) + ' cache write</span>';
  }
  if (!cachingActive) {
    html += '<span class="muted" title="This model doesn’t support cachePoint, so caching was skipped">caching n/a</span>';
  }
  if (t.coldStart) {
    html += '<span class="cold" title="First request on a new Lambda instance — don’t read this as model latency">❄ cold start</span>';
  }
  if (st.serviceTier) {
    html += '<span class="muted" title="service_tier as accepted by the endpoint on this request">service_tier ' + esc(st.serviceTier) + '</span>';
  }
  html += '</div></div>';
  return html;
}

/* ------------------------------------------------------------------- ResultPanel port */

var VERDICT_CLASS = { benign: 'v-benign', suspicious: 'v-suspicious', malicious: 'v-malicious' };

function tagRow(title, items) {
  var html = '<div class="tagrow"><span class="k">' + esc(title) + '</span>';
  for (var i = 0; i < items.length; i++) html += '<span class="tag">' + esc(items[i]) + '</span>';
  return html + '</div>';
}

/** The evidence sections. `uid` namespaces the disclosure toggles so Stage 1 and Stage 2
 *  can be open independently. */
function resultPanel(st, uid) {
  var r = st.result || {};
  var verdict = String(r.verdict === undefined || r.verdict === null ? '—' : r.verdict);
  var model = modelById(st.modelId);
  var html = '<div class="result">';

  /* --- verdict chip row --- */
  html += '<div class="result-head">';
  html += '<span class="verdict ' + (VERDICT_CLASS[verdict] || '') + '">' + esc(verdict) + '</span>';
  if (num(r.confidence) !== null) {
    html += '<span class="chip">confidence ' + esc((num(r.confidence) * 100).toFixed(0)) + '%</span>';
  }
  if (num(r.riskScore) !== null) {
    html += '<span class="chip risk">risk ' + esc(num(r.riskScore)) + '/100</span>';
  }
  if (r.recommendedAction) {
    html += '<span class="chip action">' + esc(String(r.recommendedAction).toUpperCase()) + '</span>';
  }
  if (r.disagreesWithStage1 === true) {
    html += '<span class="chip action" title="Stage 2 overturned Stage 1 — this is the pipeline earning its second call">' +
      'disagrees with Stage 1</span>';
  }
  html += '<span class="chip">' + esc(st.modelLabel) + '</span>';
  /* Lane and region only. The hover used to spell out the full host, the signing service name and
     the auth scheme; that text was removed on request, and it lived here too. */
  html += '<span class="chip">' + esc(st.endpoint + ' · ' + st.region) + '</span>';
  html += '</div>';

  /* --- latency strip --- */
  html += latencyStrip(st);

  /* --- parse-error banner: still load-bearing on the Gemma 3 lane, which has no
         json_schema and fences its output --- */
  if (st.parseError) {
    html += '<div class="warn"><strong>Model did not return valid JSON.</strong> ' + esc(st.parseError) +
      '<div class="muted">Raw output is shown below — this is a real finding worth noting.' +
      (model.supportsJsonSchema
        ? ' On this lane response_format json_schema strict:true is in force, so a parse failure here is unexpected.'
        : ' Expected on this lane: ' + esc(reasonFor(model, 'json_schema'))) +
      '</div></div>';
  }

  /* --- prose --- */
  if (r.reasoning) html += '<p class="reason">' + esc(r.reasoning) + '</p>';
  if (r.reason) html += '<p class="reason">' + esc(r.reason) + '</p>';
  if (r.senderAnalysis) {
    html += '<p class="reason"><span class="k">Sender:</span> ' + esc(r.senderAnalysis) + '</p>';
  }

  /* --- Stage 1 evidence. The prior art rendered r.categories and r.reason, neither of
         which STAGE1_SCHEMA emits — it emits signals[] of {signal, detail}, ranked
         strongest-evidence-first. Remapped here or Stage 1 renders empty. --- */
  if (Array.isArray(r.signals) && r.signals.length) {
    html += '<table class="mini"><thead><tr><th>#</th><th>Signal</th><th>Detail</th></tr></thead><tbody>';
    for (var i = 0; i < r.signals.length; i++) {
      var s = r.signals[i] || {};
      var sig = typeof s === 'string' ? s : (s.signal || '');
      var det = typeof s === 'string' ? '' : (s.detail || '');
      html += '<tr class="sigrow"><td class="num">' + (i + 1) + '</td><td>' + esc(sig) + '</td><td>' + esc(det) + '</td></tr>';
    }
    html += '</tbody></table>';
  }

  if (Array.isArray(r.threatTypes) && r.threatTypes.length) html += tagRow('Threat types', r.threatTypes);
  if (Array.isArray(r.socialEngineeringTactics) && r.socialEngineeringTactics.length) {
    html += tagRow('Social engineering', r.socialEngineeringTactics);
  }

  /* --- URL table --- */
  if (Array.isArray(r.urls) && r.urls.length) {
    html += '<table class="mini"><thead><tr><th>URL</th><th>Verdict</th><th>Reason</th></tr></thead><tbody>';
    for (var j = 0; j < r.urls.length; j++) {
      var u = r.urls[j] || {};
      html += '<tr><td class="mono break">' + esc(u.url) + '</td>' +
        '<td><span class="verdict-sm ' + (VERDICT_CLASS[u.verdict] || '') + '">' + esc(u.verdict) + '</span></td>' +
        '<td>' + esc(u.reason) + '</td></tr>';
    }
    html += '</tbody></table>';
  }

  /* --- attachment table --- */
  if (Array.isArray(r.attachmentFindings) && r.attachmentFindings.length) {
    html += '<table class="mini"><thead><tr><th>Attachment</th><th>Risk</th><th>Reason</th></tr></thead><tbody>';
    for (var k = 0; k < r.attachmentFindings.length; k++) {
      var a = r.attachmentFindings[k] || {};
      html += '<tr><td class="mono">' + esc(a.name) + '</td><td>' + esc(a.risk) + '</td><td>' + esc(a.reason) + '</td></tr>';
    }
    html += '</tbody></table>';
  }

  /* --- token replay (design 7.2): real recorded inter-token gaps, honestly badged --- */
  html += tokenReplay(st, uid);

  /* --- the disclosures. "Here is the exact prompt we sent and the exact bytes that came
         back" is the most convincing element in the existing UI. --- */
  html += '<div class="toggles">' +
    '<button class="link" data-disclose="prompt-' + uid + '" data-disclose-label="prompt sent">Show prompt sent</button>' +
    '<button class="link" data-disclose="raw-' + uid + '" data-disclose-label="raw output">Show raw output</button>' +
    '</div>';
  html += '<div class="disclosure" id="prompt-' + uid + '" hidden>' +
    '<div class="k">System</div><pre>' + esc(st.promptSent.system || '(not returned)') + '</pre>' +
    '<div class="k">User</div><pre>' + esc(st.promptSent.user || '(not returned)') + '</pre></div>';
  html += '<div class="disclosure" id="raw-' + uid + '" hidden><pre>' + esc(st.raw || '(empty)') + '</pre>' +
    (st.stopReason ? '<div class="muted">stopReason: ' + esc(st.stopReason) + '</div>' : '') + '</div>';

  html += '</div>';
  return html;
}

/* --------------------------------------------------------- token replay (design 7.2) */

function tokenReplay(st, uid) {
  var tl = st.timeline || [];
  var deltas = tl.length;
  var first = deltas ? ms(tl[0].tMs) : null;
  var last = deltas ? ms(tl[deltas - 1].tMs) : null;
  var html = '<div class="replay"><div class="replay-head">';
  html += '<span class="badge" title="Function URLs are SCP-blocked in this org, so the response is buffered through API Gateway. ' +
    'TTFT is still measured server-side at the Lambda on the first content delta — only this animation is a replay, ' +
    'and it uses the real recorded inter-token gaps.">replayed from server timeline</span>';
  if (deltas) {
    html += '<span class="muted small">' + deltas + ' deltas · first at ' + fmt(first) + ' ms · last at ' + fmt(last) + ' ms</span>';
    html += '<button class="link" data-replay="' + uid + '">replay</button>';
  } else {
    html += '<span class="muted small">no timeline recorded on this response</span>';
  }
  html += '</div><pre id="replay-' + uid + '"></pre></div>';
  return html;
}

/** Schedule each delta at its own recorded offset, so the playback carries the real gaps
 *  rather than a uniform typewriter tick. */
function playReplay(uid, timeline) {
  var el = document.getElementById('replay-' + uid);
  if (!el) return;
  if (el._timers) el._timers.forEach(clearTimeout);
  el._timers = [];
  el.textContent = '';
  if (!timeline || !timeline.length) {
    el.textContent = '(no timeline recorded on this response)';
    return;
  }
  var t0 = num(timeline[0].tMs) || 0;
  timeline.forEach(function (d) {
    var at = Math.max(0, (num(d.tMs) || 0) - t0);
    el._timers.push(setTimeout(function () {
      el.textContent += String(d.text === undefined || d.text === null ? '' : d.text);
      el.scrollTop = el.scrollHeight;
    }, at));
  });
}

/* --------------------------------------------------------------- RunHistory port */

function runHistory() {
  if (!state.runs.length) {
    return '<p class="muted">No runs yet. Latency from a single request is noise — run a few.</p>';
  }
  var e2e = [], ttft = [];
  state.runs.forEach(function (r) {
    if (num(r.e2eMs) !== null) e2e.push(r.e2eMs);
    if (num(r.ttftMs) !== null) ttft.push(r.ttftMs);
  });

  var html = '<div class="stats">';
  html += '<span><strong>' + state.runs.length + '</strong> runs</span>';
  html += '<span>E2E P50 <strong>' + fmt(pct(e2e, 50)) + '</strong>ms</span>';
  html += '<span>P95 <strong>' + fmt(pct(e2e, 95)) + '</strong>ms</span>';
  html += '<span>TTFT P50 <strong>' + fmt(pct(ttft, 50)) + '</strong>ms</span>';
  html += '<span>P95 <strong>' + fmt(pct(ttft, 95)) + '</strong>ms</span>';
  html += '<button class="link" id="clear-runs">clear</button></div>';

  html += '<table class="mini history"><thead><tr>' +
    '<th>#</th><th>Time</th><th>Stage</th><th>Model</th>' +
    '<th>TTFT</th><th>E2E</th><th>Bedrock</th><th>Out</th><th>Verdict</th>' +
    '</tr></thead><tbody>';
  state.runs.slice().reverse().forEach(function (r) {
    html += '<tr>' +
      '<td>' + r.n + '</td>' +
      '<td class="mono">' + esc(r.at) + '</td>' +
      '<td>' + (r.stage === 'classify' ? 'S1' : 'S2') + '</td>' +
      '<td class="truncate" title="' + esc(r.modelLabel) + '">' + esc(r.modelLabel) + '</td>' +
      '<td class="num">' + fmt(r.ttftMs) + '</td>' +
      '<td class="num">' + fmt(r.e2eMs) + '</td>' +
      '<td class="num">' + (r.bedrockLatencyMs === null ? 'n/a' : fmt(r.bedrockLatencyMs)) + '</td>' +
      '<td class="num">' + esc(r.outputTokens) + '</td>' +
      '<td>' + esc(r.verdict) + (r.cached ? ' ⚡' : '') + '</td>' +
      '</tr>';
  });
  return html + '</tbody></table>';
}

function recordRun(st) {
  state.runs.push({
    n: state.runs.length + 1,
    at: new Date().toLocaleTimeString(),
    stage: st.stage,
    modelLabel: st.modelLabel,
    ttftMs: st.timings.ttftMs,
    e2eMs: st.timings.e2eMs,
    bedrockLatencyMs: st.timings.bedrockLatencyMs,
    outputTokens: st.usage.outputTokens,
    cached: st.usage.cacheReadInputTokens > 0,
    verdict: String((st.result && st.result.verdict) || (st.parseError ? 'parse error' : '—'))
  });
}

/* ============================================================ TAB 1 — SCAN =========== */

/** Human gloss on the server's escalation reason string (design 4.4). The raw string is
 *  always shown as well; this only explains which clause fired. */
function escalationGloss(reason) {
  if (!reason) return '';
  if (reason.indexOf('parse_failed') === 0) {
    return 'Stage 1 output did not parse, so the gate escalated rather than trusting it.';
  }
  if (reason.indexOf('verdict=') === 0) {
    return 'Stage 1 did not come back benign.';
  }
  if (reason.indexOf('low_confidence') === 0) {
    return 'Stage 1 said benign but below the 0.85 calibrated-confidence floor.';
  }
  if (reason.indexOf('url_present') === 0) {
    return 'Belt and braces: a URL is present even though Stage 1 said benign. Keying only on the ' +
      'model verdict would silently skip the deep scan on a false negative.';
  }
  if (reason.indexOf('attachment_present') === 0) {
    return 'Belt and braces: an attachment is present even though Stage 1 said benign.';
  }
  return 'Server-side gate reason, passed through verbatim.';
}

/** The gate verdict on a Simple Scan result. `wouldEscalate`, not `escalated`: no Stage 2 ran
 *  on POST /classify, so the arrow says what the gate DECIDED, and the Deep Scan button is the
 *  thing that acts on it. The decision itself comes from the server's should_escalate() — this
 *  page never evaluates the gate, or the product's escalation logic would live in client code
 *  that anyone reading the page could edit. */
function escalationArrow(st) {
  if (st.wouldEscalate === undefined || st.wouldEscalate === null) {
    return '<div class="arrow quiet"><strong>gate not evaluated</strong>' +
      '<div class="why">This response carried no gate decision. On <span class="mono">POST ' +
      esc(API_BASE) + '/classify</span> the server returns one; a Deep Scan run on its own does ' +
      'not, because the gate is what decides whether to reach Stage 2 in the first place.</div></div>';
  }
  if (st.wouldEscalate) {
    return '<div class="arrow">' +
      '<strong>the gate would escalate ↓</strong> <code>' + esc(st.escalationReason || '(no reason returned)') + '</code>' +
      '<div class="why">' + esc(escalationGloss(st.escalationReason)) +
      ' Decided server-side in should_escalate(), never by this page. Press <strong>Deep Scan</strong> ' +
      'to run the stage it is asking for.</div></div>';
  }
  return '<div class="arrow quiet">' +
    '<strong>the gate would stop here</strong> — no Stage 2 warranted' +
    '<div class="why">Benign, confident, and no URL or attachment. In production this email ' +
    'costs one cheap call and nothing else, which is what turns the two-stage pipeline into a ' +
    'throughput and cost strategy rather than just a latency one. Deep Scan still runs on ' +
    'demand — that is the comparison this tab is for.</div></div>';
}

/** The live system-prompt editor. Editable body on top, server-appended parts read-only below,
 *  because the split is the security property: prompts.system_for re-appends the guard to
 *  whatever body it is handed, so this textarea cannot delete it. */
function promptEditor(model) {
  var stage = state.promptStage;
  var body = state.promptBodies[stage] || '';
  var edited = !!state.promptEdited[stage];
  var overLimit = body.length > MAX_PROMPT_CHARS;

  var html = '<h3 style="margin-bottom:4px">System prompt <span class="muted small" ' +
    'style="font-weight:400">— live, sent on the next scan</span></h3>';

  html += '<label for="prompt-stage">Editing</label><select id="prompt-stage">';
  ['classify', 'deep-scan'].forEach(function (s) {
    html += '<option value="' + esc(s) + '"' + (stage === s ? ' selected' : '') + '>' +
      esc(STAGE_LABEL[s]) + (state.promptEdited[s] ? ' — edited' : '') + '</option>';
  });
  html += '</select>';

  html += '<div class="row wrap" style="align-items:center;margin:6px 0 2px">' +
    '<span class="muted small" style="flex:1">' +
    (edited ? '<strong>Edited.</strong> This body is what the next ' + esc(STAGE_LABEL[stage]) +
      ' sends, in place of the default.'
            : 'Showing the default body, prefilled verbatim from the server.') +
    '</span>' +
    '<button class="link" id="prompt-reset"' + (edited ? '' : ' disabled') + '>reset to default</button></div>';

  html += '<textarea id="prompt-body" rows="14" class="mono" spellcheck="false">' + esc(body) + '</textarea>';
  html += '<div class="muted small">' + esc(body.length.toLocaleString()) + ' / ' +
    esc(MAX_PROMPT_CHARS.toLocaleString()) + ' characters' +
    (overLimit ? ' — <strong style="color:var(--crit)">over the ceiling; the server will refuse this with a 400</strong>'
               : '') + '. Every character is billed as input on every request at this prompt.</div>';

  /* --- what the server appends no matter what is in the box above --- */
  html += '<div class="toggles"><button class="link" data-disclose="prompt-appended" ' +
    'data-disclose-label="what the server appends">Show what the server appends</button></div>';
  html += '<div class="disclosure" id="prompt-appended" hidden>';
  if (!model.supportsJsonSchema) {
    html += '<div class="k">JSON shape — appended on this lane (no <span class="mono">response_format</span>)</div>' +
      '<pre>' + esc(DEFAULT_JSON_SHAPES[stage]) + '</pre>';
  } else {
    html += '<div class="k">JSON shape — <em>not</em> appended on this lane</div>' +
      '<div class="muted small" style="padding:0 0 8px">This model takes ' +
      '<span class="mono">response_format: json_schema, strict: true</span>, so the shape is ' +
      'enforced by the API instead of restated in the prompt. Switch to the Converse lane and ' +
      'this block appears on the wire.</div>';
  }
  html += '<div class="k">Injection guard — appended always, and always last</div>' +
    '<pre>' + esc(INJECTION_GUARD) + '</pre></div>';

  html += '<div class="muted small">Read-only on purpose, and it is the point of the split: the ' +
    'server appends these to whatever body you send, in this order, so an edit here can retune ' +
    'the analysis and cannot delete the guard or move it off the end. The prior art let the ' +
    'client replace the whole system prompt, which made the guard client-deletable on a product ' +
    'whose input is adversarial by definition.</div>';
  html += '<div class="muted small">Honoured on <span class="mono">/scan</span>, ' +
    '<span class="mono">/classify</span> and <span class="mono">/deep-scan</span> — all behind ' +
    'the Cognito authorizer. Ignored on <span class="mono">/public/scan</span>: a key-holder who ' +
    'could supply system instructions would have an LLM proxy on this account’s Bedrock quota ' +
    'rather than an email scanner.</div>';
  return html;
}

/** Side-by-side latency for the two stages, once both have run. The comparison is the reason
 *  the buttons are separate: a pipeline total hides which stage the time went to. Refuses to
 *  compare across two different prompts or two different lanes, because that is not a
 *  comparison — it says which one moved instead. */
function scanCompare(s1, s2) {
  if (!s1 || !s2) return '';
  var rows = [
    ['TTFT', s1.timings.ttftMs, s2.timings.ttftMs, ' ms'],
    ['E2E', s1.timings.e2eMs, s2.timings.e2eMs, ' ms'],
    ['Output tokens', s1.usage.outputTokens, s2.usage.outputTokens, ''],
    ['Input tokens', s1.usage.inputTokens, s2.usage.inputTokens, '']
  ];
  var mismatch = [];
  if (s1.modelId !== s2.modelId) mismatch.push('a different model');
  if (s1.region !== s2.region) mismatch.push('a different region');
  if (!!s1.promptOverridden !== !!s2.promptOverridden) mismatch.push('a different system prompt');

  var html = '<h3>Simple vs Deep</h3>';
  if (mismatch.length) {
    html += '<div class="warn"><strong>These two ran under ' + esc(mismatch.join(' and ')) +
      '.</strong> The rows below are still each stage’s own measurement, but the difference between ' +
      'them is not attributable to the stage. Re-run both under the same settings to compare them.</div>';
  }
  html += '<table class="mini"><thead><tr><th>Metric</th><th class="num">Simple</th>' +
    '<th class="num">Deep</th><th class="num">Δ</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var a = num(r[1]), b = num(r[2]);
    var delta = (a === null || b === null) ? null : b - a;
    html += '<tr><td>' + esc(r[0]) + '</td>' +
      '<td class="num">' + fmt(a) + esc(r[3]) + '</td>' +
      '<td class="num">' + fmt(b) + esc(r[3]) + '</td>' +
      '<td class="num">' + (delta === null ? '—' :
        (delta > 0 ? '+' : '') + esc(Math.round(delta).toLocaleString()) + esc(r[3])) + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="muted small">Deep Scan is the expensive stage by construction — a larger token ' +
    'budget on a longer instruction. That is exactly why the gate exists: at a ~15% escalation rate ' +
    'the expensive stage needs a fraction of the quota headroom the cheap one does.</div>';
  return html;
}

/** One scan card: header, error, or result. `slot` is 'simple' | 'deep'. */
function scanCard(slot) {
  var isSimple = slot === 'simple';
  var st = isSimple ? state.simple : state.deep;
  var busy = isSimple ? state.busySimple : state.busyDeep;
  var error = isSimple ? state.errorSimple : state.errorDeep;
  var errorClass = isSimple ? state.errorClassSimple : state.errorClassDeep;
  var stage = isSimple ? 'classify' : 'deep-scan';
  var uid = isSimple ? 's1' : 's2';

  var html = '<div class="stage-card"><div class="stage-title">' +
    '<span class="n">' + (isSimple ? 'Stage 1' : 'Stage 2') + '</span>' +
    '<h3 style="margin:0">' + (isSimple ? 'Simple Scan' : 'Deep Scan') + '</h3>' +
    '<span class="muted small">maxTokens ' + STAGE_MAX_TOKENS[stage] + ' · temperature 0 · target ' +
    (isSimple ? 'E2E P50 &lt; ' + TARGETS.classifyP50Ms + ' ms' : 'E2E P95 &lt; ' + TARGETS.deepScanP95Ms + ' ms') +
    '</span></div>';

  if (error) {
    html += '<div class="danger"><strong>' + (isSimple ? 'Simple Scan' : 'Deep Scan') + ' failed.</strong> ' +
      esc(error) +
      (errorClass ? '<div class="muted">errorClass: <code>' + esc(errorClass) + '</code></div>' : '') +
      '</div>';
  } else if (busy) {
    html += '<p class="muted">Running…</p>';
  } else if (st) {
    if (st.promptOverridden) {
      html += '<div class="warn"><strong>Ran on an edited system prompt.</strong> The body came from the ' +
        'editor, not from prompts.py — so this verdict and this latency describe your prompt, and are not ' +
        'comparable to a default-prompt run or to any benchmark number. The injection guard was still ' +
        'appended server-side; open “Show prompt sent” for the exact bytes.</div>';
    }
    html += resultPanel(st, uid);
  } else {
    html += '<p class="muted">Not run yet. Press <strong>' +
      (isSimple ? 'Simple Scan' : 'Deep Scan') + '</strong>.</p>';
  }
  return html + '</div>';
}
